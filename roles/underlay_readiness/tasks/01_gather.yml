---
# Three device round-trips, then everything else is derived locally. Kept to as
# few tasks as possible: at fabric scale each task costs a console line per
# host, and 500 switches x 15 tasks is not something anyone reads.
#
# The two operational-state reads are separate tasks and both are non-fatal.
# ios_command raises on the first command that errors and returns no stdout at
# all, so sharing one task means a switch with its SNMP agent off loses the OSPF
# output too -- see the comments on each.
#
# The running config is reused when acm_evpn has already fetched it, so running
# this as a pre-flight costs one extra round-trip and no extra config fetch.

- name: Verify site configuration
  ansible.builtin.import_tasks: assert_site_config.yml

- name: Readiness — fetch running configuration
  cisco.ios.ios_command:
    commands: "show running-config"
  register: _readiness_run
  # Read-only: must run under --check, or the registered result is a skip stub
  # and everything downstream fails resolving .stdout.
  check_mode: false
  when: current_run_config is not defined
  # A switch that is down must not abort a fabric-wide run. It is reported as
  # unreachable in the summary instead; see 05_report.yml.
  ignore_unreachable: true

# SNMPv3 users and groups are hidden from 'show running-config', so operational
# state is the only place they are visible. Neither command reveals a password.
#
# ITS OWN TASK, and non-fatal. A switch that has never had SNMP configured
# answers 'show snmp user' with '%SNMP agent not enabled', and cisco.ios treats
# a leading '%' as a device error -- so a fresh fabric died here, at the gather
# step, on precisely the switches this role exists to configure. The state of
# the world this read is meant to DISCOVER was the state that made it fail.
#
# It cannot share a task with the OSPF read either: ios_command raises on the
# first command that errors and returns no stdout at all, so one unenabled SNMP
# agent would take the OSPF output with it and every switch would silently
# report zero routers in the area.
#
# 'failed_when: false' rather than a match on the message text. Whatever stopped
# us reading SNMP state -- agent off, command unsupported, authorisation --
# the honest answer downstream is the same: no user and no group were seen, so
# report them missing and let 03_apply_snmp.yml install them.
- name: Readiness — read SNMPv3 operational state
  cisco.ios.ios_command:
    commands:
      - "show snmp user"
      - "show snmp group"
  register: _readiness_snmp
  check_mode: false
  ignore_unreachable: true
  failed_when: false
  when: current_run_config is defined or _readiness_run.stdout is defined

# 'database database-summary' rather than 'database router': a handful of lines
# instead of one LSA dump per router, and it reports the per-area router count
# directly, which is the only thing wanted.
#
# Non-fatal for the same reason as SNMP above: a switch with no OSPF process is
# something to REPORT -- the checks below have a finding for exactly that -- not
# something to abort a fabric-wide run on.
- name: Readiness — read OSPF operational state
  cisco.ios.ios_command:
    commands:
      - "show ip ospf {{ readiness_ospf_process }} database database-summary"
  register: _readiness_ospf
  check_mode: false
  ignore_unreachable: true
  failed_when: false
  when: current_run_config is defined or _readiness_run.stdout is defined

# Split the config into {top-level line: [trimmed child lines]}. Every check
# downstream is then an exact membership test, which beats a regex per command:
# no escaping, and 'ip pim sparse-mode' cannot satisfy itself by appearing as a
# substring of some longer line.
#
# Indentation is tested before '!' deliberately. An indented '!' is a separator
# INSIDE a stanza (router bgp is full of them) and must not end it -- getting
# this backwards silently truncated stanza parsing once already.
- name: Readiness — index the running configuration by stanza
  ansible.builtin.set_fact:
    _run: "{{ _cfg }}"
    _stanzas: "{{ _idx | from_json }}"
  vars:
    _cfg: >-
      {{ current_run_config.stdout[0] if current_run_config is defined
         else _readiness_run.stdout[0] }}
    _idx: >-
      {%- set ns = namespace(cur=none) -%}
      {%- set stanzas = {} -%}
      {%- for raw in _cfg.splitlines() -%}
      {%-   set line = raw.rstrip() -%}
      {%-   if line.startswith(' ') -%}
      {%-     if ns.cur is not none -%}
      {%-       set _ = stanzas[ns.cur].append(line.strip()) -%}
      {%-     endif -%}
      {%-   elif not line.strip() or line.startswith('!')
              or line.strip() == 'end'
              or line.startswith('Building configuration')
              or line.startswith('Current configuration') -%}
      {%-     set ns.cur = none -%}
      {%-   else -%}
      {%-     set ns.cur = line.strip() -%}
      {%-     set _ = stanzas.setdefault(ns.cur, []) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ stanzas | to_json }}
  # Gated on having a config to index, which is what this actually needs. It
  # used to be gated on the operational-state read instead, which was a proxy
  # for "the device answered" -- and stopped being one the moment that read was
  # allowed to fail on a switch whose SNMP agent is off.
  when: current_run_config is defined or _readiness_run.stdout is defined

- name: Readiness — derive underlay facts
  ansible.builtin.set_fact:
    # Routers in the fabric's OSPF area, computed under 'vars' below rather than
    # here. A set_fact key CANNOT read a sibling key of the same task -- and
    # _readiness_routing_enabled needs this same number, so reading it from the
    # fact was an undefined-variable crash waiting for the right switch.
    #
    # It waited a long time, because Jinja's 'or' short-circuits: every switch
    # in service has either 'ip routing' or 'router ospf 1' in its config, so
    # the term that touched this was never evaluated. A C9400/9500/9600 with
    # OSPF not yet configured has neither -- 'ip routing' is that platform's
    # silent default and so is never rendered -- and that is a switch this role
    # is supposed to REPORT on, not die on.
    _readiness_ospf_routers: "{{ _ospf_routers }}"
    # Is this switch routing? Derived once because three places need the same
    # answer: the assertions, the remediation file, and platform_baseline.j2,
    # which uses it to decide whether pushing 'ip routing' is worth doing.
    #
    # ABSENCE of 'ip routing' proves nothing -- it is the default state on the
    # C9400/9500/9600. PRESENCE of 'no ip routing' proves it is off, since a
    # running config states deviations from the default.
    _readiness_routing_disabled: "{{ 'no ip routing' in _stanzas }}"
    _readiness_routing_enabled: >-
      {{ 'no ip routing' not in _stanzas
         and ('ip routing' in _stanzas
              or ('router ospf ' ~ readiness_ospf_process) in _stanzas
              or (_ospf_routers | int) >= 1) }}
    # A fabric uplink is any routed interface enrolled in the fabric's OSPF
    # process. Derived rather than named, so nothing depends on an interface
    # naming convention. Matched on the process alone, not the area: an uplink
    # in the wrong area must be FOUND so it can be reported, rather than
    # dropping out of the check. Loopbacks are checked separately; SVIs are
    # never fabric uplinks and would fail 'no switchport' for the wrong reason.
    _readiness_uplinks: "{{ _uplinks | from_json }}"
    _readiness_lo0: "{{ _lo0 }}"
    # 'system mtu' is rendered only when it is NOT the platform default of
    # 1500, so absence is a fact here rather than an ambiguity: every C9K
    # defaults to 1500, and 1500 is below the floor, so a switch that never
    # had it set is correctly reported. This is the opposite of the 'ip
    # routing' case above, where the default varies by platform and absence
    # therefore proves nothing.
    #
    # The '[0-9]+' is what makes this safe, not the anchor: IOS has sibling
    # commands in this space ('system mtu routing 1500'), and a prefix match on
    # 'system mtu ' reads 'routing' as the number and silently yields 0. The
    # trailing '$' then pins it to exactly this command; 'match' anchors only
    # at the start, so it is not implied.
    _readiness_system_mtu: "{{ _sys_mtu }}"
    # 'show snmp user' / 'show snmp group', or an empty string when the read did
    # not produce one. Normalised HERE, once, so that neither the check nor the
    # apply task has to know the read is allowed to fail -- an empty string means
    # "no SNMPv3 user was seen", which is exactly what both of them do with it.
    _readiness_snmp_users: >-
      {{ _readiness_snmp.stdout[0]
         if (_readiness_snmp.stdout | default([]) | length) > 0 else '' }}
    _readiness_snmp_groups: >-
      {{ _readiness_snmp.stdout[1]
         if (_readiness_snmp.stdout | default([]) | length) > 1 else '' }}
  vars:
    _uplinks: >-
      {%- set out = [] -%}
      {%- for name, body in _stanzas.items() if name.startswith('interface ') -%}
      {%-   set intf = name.split(' ', 1)[1] -%}
      {%-   if not intf.startswith('Loopback') and not intf.startswith('Vlan')
              and body | select('match', 'ip ospf ' ~ readiness_ospf_process ~ ' area ')
                       | list | length > 0 -%}
      {%-     set _ = out.append(intf) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | to_json }}
    _lo0: >-
      {%- set addrs = _stanzas.get('interface ' ~ vtep_source_intf, [])
                      | select('match', 'ip address ') | list -%}
      {{ addrs[0].split()[2] if addrs else '' }}
    _sys_mtu: >-
      {%- set found = _stanzas | select('match', 'system mtu [0-9]+$') | list -%}
      {{ found[0].split()[2] | int if found else 1500 }}
    # The OSPF read is allowed to fail, so the output may not be there at all;
    # an empty string falls through the same path a non-matching one does.
    _ospf_out: >-
      {{ _readiness_ospf.stdout[0]
         if (_readiness_ospf.stdout | default([]) | length) > 0 else '' }}
    # 'default([], true)' before 'first' is load-bearing -- regex_search returns
    # None when it does not match (a switch with no OSPF, or a different output
    # format) and 'first' raises on None before a trailing default can help.
    _ospf_routers: >-
      {{ (_ospf_out
          | regex_search('Area ' ~ readiness_ospf_area
                         ~ ' database summary[\s\S]*?Router\s+(\d+)', '\1')
          | default([], true) | first | default(0)) | int }}
  when: _stanzas is defined

# Cross-device, so it cannot be another key in the task above: that task is
# where each host publishes its own MTU, and this one has to read what the
# others published. Under 'strategy: linear' every host finishes the task above
# before any host starts this one -- the same ordering 05_report.yml's run_once
# tasks already depend on, and which every playbook here sets explicitly.
#
# It costs one more console line per host, which the rest of this file works
# hard to avoid. The alternative is comparing MTU in 05_report.yml, and that
# runs after 04_apply_baseline.yml has already pushed a value.
- name: Readiness — resolve the fabric's system MTU
  ansible.builtin.set_fact:
    readiness_fabric_mtu: "{{ _consensus }}"
  vars:
    # The value this fabric has settled on, or 0 when it has not: either no
    # member was read, or two values tied for most common. Zero needs no
    # special handling downstream -- an MTU is never 0, so "this switch differs
    # from its fabric" and "the fabric has no single value" reduce to the same
    # comparison in 02_check.yml.
    #
    # Only members this run actually READ are counted, which is what makes the
    # check degrade honestly rather than wrongly. A run scoped to one switch
    # finds only itself, agrees with itself, and checks the floor alone; a
    # fabric-wide run checks both. An unreachable member is excluded for the
    # same reason: its MTU was never seen, so it cannot be judged or counted.
    _consensus: >-
      {%- set counts = {} -%}
      {%- for h in fabric_members | default([]) -%}
      {%-   set v = hostvars[h].get('_readiness_system_mtu') -%}
      {%-   if v -%}
      {%-     set _ = counts.update({v | int: counts.get(v | int, 0) + 1}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- set top = counts.values() | list | max if counts else 0 -%}
      {%- set winners = [] -%}
      {%- for value, seen in counts.items() if seen == top -%}
      {%-   set _ = winners.append(value) -%}
      {%- endfor -%}
      {{ winners[0] if winners | length == 1 else 0 }}
  when: _stanzas is defined

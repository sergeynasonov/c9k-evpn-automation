---
# ONE task produces the whole verdict. Each check keeps its own named block in
# 'vars' so the logic stays readable, but the play prints a single line per host
# instead of one per category -- which is the difference between a readable run
# and 500 switches x 8 checks of console noise.
#
# Findings are STRUCTURED, not prose:
#   msg     - the human sentence, for the console summary
#   parents - config context for remediation, e.g. ['interface Te1/1/1']
#   lines   - the CLI that would fix it, if it can be expressed as config
# A finding with no 'lines' needs human judgement and is emitted as a comment in
# the remediation file rather than a command.
#
# Nothing here changes the device. The underlay is hand-built at day 0 and
# silently remediating it would reintroduce exactly the risk that keeping it
# device-owned was meant to avoid.

- name: Readiness — check the underlay
  ansible.builtin.set_fact:
    readiness_failures: >-
      {{ (_global | from_json) + (_routing | from_json) + (_defaults | from_json)
         + (_mtu | from_json) + (_loopback | from_json) + (_ospf | from_json)
         + (_uplinks | from_json) + (_snmp | from_json) + (_syslog | from_json)
         + (_spine | from_json) }}
    readiness_ospf_area_routers: "{{ _readiness_ospf_routers | int }}"
  vars:
    # --- global single-line settings -------------------------------------
    _global: >-
      {%- set bad = [] -%}
      {%- for line in readiness_global_lines if line not in _stanzas -%}
      {%-   set _ = bad.append({'msg': 'missing global: ' ~ line,
                                'parents': [], 'lines': [line]}) -%}
      {%- endfor -%}
      {{ bad | to_json }}

    # --- IP routing, checked by consequence ------------------------------
    # 'ip routing' is default-ON for the C9400/9500/9600 so those never print
    # it; the C9300 has it off by default and does. Absence therefore proves
    # nothing, while presence of 'no ip routing' proves everything -- see
    # 01_gather.yml, where both facts are derived.
    _routing: >-
      {%- set bad = [] -%}
      {%- if _readiness_routing_disabled | bool -%}
      {%-   set _ = bad.append({
              'msg': 'IP routing is explicitly DISABLED ("no ip routing") -- the switch cannot route',
              'parents': [], 'lines': ['ip routing']}) -%}
      {%- elif not (_readiness_routing_enabled | bool) -%}
      {%-   set _ = bad.append({
              'msg': 'IP routing does not appear to be enabled: no "ip routing" line, no "router ospf '
                     ~ readiness_ospf_process ~ '", and no OSPF database',
              'parents': [], 'lines': ['ip routing']}) -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- platform defaults that must not be overridden --------------------
    # A default is not rendered, so it cannot be asserted positively. A
    # NON-default value IS rendered, so the line appearing at all is the
    # finding. Same asymmetry as 'no ip routing'.
    #
    # 'ip tcp window-size' USED TO BE HERE and is deliberately gone. The check
    # assumed one right value across the fabric (131072) and reported anything
    # else; the value is platform-specific, so on a real fabric it fired on
    # every switch at once for a setting that was correct on each of them. A
    # check that cannot be satisfied except by making the fabric uniform is
    # asserting a fabric-wide policy this role has no business holding -- and
    # seven identical findings is how a summary stops being read at all.
    #
    # The bar for adding something here: wrong on ANY platform, not merely
    # different between them.
    _defaults: >-
      {%- set bad = [] -%}
      {%- if 'no hidekeys' in _stanzas.get('archive', []) -%}
      {%-   set _ = bad.append({
              'msg': 'archive log config: "no hidekeys" -- archived configurations will contain credentials in clear text',
              'parents': ['archive', ' log config'], 'lines': ['hidekeys']}) -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- system MTU --------------------------------------------------------
    # THE CHECK IS THE FLOOR. This used to demand "system mtu 9100" verbatim
    # and failed every fabric built on anything else; what the underlay
    # actually has to carry is 1500 + 50 bytes of VXLAN header. At or above
    # that the value is the fabric's own choice, and a fabric standardised on
    # 1600 or 9216 is left alone.
    #
    # Consistency matters too -- OSPF puts the interface MTU in its DBD packets
    # and will not form an adjacency when the two ends disagree -- but it is a
    # SECONDARY signal here, because of how it presents. A leaf or distribution
    # switch whose MTU is out of step forms no adjacency, so its loopback is
    # never advertised into the underlay and Ansible cannot reach it at all: it
    # lands in the summary as UNREACHABLE, not as an MTU finding. The switch
    # this branch actually catches is a BORDER, which stays reachable over its
    # BGP handoff whatever the fabric IGP is doing. Worth reporting for exactly
    # that case, and worth knowing that an unreachable leaf may be this same
    # fault seen from the other side.
    #
    # 'elif': a switch below the floor is already being told to change, so
    # reporting it twice for one fault only makes the summary harder to read.
    # The mismatch branch carries no command at all -- changing system MTU
    # bounces every interface on the box, and which end moves is a judgement
    # about the fabric, not about this switch.
    _mtu: >-
      {%- set bad = [] -%}
      {%- set floor = readiness_system_mtu_min | int -%}
      {%- set mine = _readiness_system_mtu | int -%}
      {#- Group the fabric by the MTU each member was READ at. Capped at three
          names per value: this runs per host, so an inconsistent 500-switch
          fabric would otherwise print 500 names 500 times. -#}
      {%- set by_mtu = {} -%}
      {%- for h in fabric_members | default([]) | sort -%}
      {%-   set seen = hostvars[h].get('_readiness_system_mtu') -%}
      {%-   if seen -%}
      {%-     set _ = by_mtu.setdefault(seen | int, []).append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- set parts = [] -%}
      {%- for value in by_mtu | sort -%}
      {%-   set hosts = by_mtu[value] -%}
      {%-   set _ = parts.append(value ~ ' on ' ~ hosts[:3] | join(', ')
                                 ~ (' and ' ~ (hosts | length - 3) ~ ' more'
                                    if hosts | length > 3 else '')) -%}
      {%- endfor -%}
      {#- 9100 flat, not the fabric's current value. A switch below the floor
          cannot hold an adjacency with the fabric anyway, so it is not joining
          an established one in any useful sense -- it is being built, and 9100
          is the build value: above the floor, and wide enough for jumbo tenant
          frames on top of the VXLAN header.

          The same literal is in platform_baseline.j2, which installs it on the
          standalone path. Deliberately not lifted into a variable for one
          value; test_system_mtu.py asserts the two agree instead. -#}
      {%- if mine < floor -%}
      {%-   set _ = bad.append({
              'msg': 'system mtu ' ~ mine
                     ~ (' (the platform default -- no "system mtu" line is configured)'
                        if mine == 1500 else '')
                     ~ ' is below the ' ~ floor ~ ' that VXLAN needs: 50 bytes of outer'
                     ~ ' header on top of a standard 1500-byte tenant frame',
              'parents': [],
              'lines': ['system mtu 9100']}) -%}
      {#- An MTU is never 0, so the single comparison covers both "this switch
          is the odd one out" and "the fabric has no dominant value at all";
          see readiness_fabric_mtu in 01_gather.yml. -#}
      {%- elif (readiness_fabric_mtu | int) != mine -%}
      {%-   set _ = bad.append({
              'msg': 'system mtu ' ~ mine ~ ' -- this fabric does not agree on one value ('
                     ~ parts | join('; ') ~ '); OSPF carries the MTU in its DBD packets'
                     ~ ' and will not form an adjacency across a mismatch',
              'parents': [], 'lines': []}) -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- the VTEP loopback -------------------------------------------------
    _loopback: >-
      {%- set bad = [] -%}
      {%- set body = _stanzas.get('interface ' ~ vtep_source_intf, []) -%}
      {%- set ctx = ['interface ' ~ vtep_source_intf] -%}
      {%- if 'interface ' ~ vtep_source_intf not in _stanzas -%}
      {%-   set _ = bad.append({'msg': 'missing interface ' ~ vtep_source_intf,
                                'parents': [], 'lines': []}) -%}
      {%- else -%}
      {%-   if not _readiness_lo0 -%}
      {%-     set _ = bad.append({'msg': vtep_source_intf ~ ': no IP address',
                                  'parents': [], 'lines': []}) -%}
      {%-   elif ('ip address ' ~ _readiness_lo0 ~ ' 255.255.255.255') not in body -%}
      {%-     set _ = bad.append({
                'msg': vtep_source_intf ~ ': ' ~ _readiness_lo0 ~ ' is not a /32 -- it is the VTEP'
                       ~ ' source and the router-id, so a shorter mask breaks EVPN next-hop reachability',
                'parents': ctx,
                'lines': ['ip address ' ~ _readiness_lo0 ~ ' 255.255.255.255']}) -%}
      {%-   endif -%}
      {%-   for line in readiness_loopback_lines if line not in body -%}
      {%-     set _ = bad.append({'msg': vtep_source_intf ~ ': missing "' ~ line ~ '"',
                                  'parents': ctx, 'lines': [line]}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- the OSPF process --------------------------------------------------
    _ospf: >-
      {%- set bad = [] -%}
      {%- set proc = 'router ospf ' ~ readiness_ospf_process -%}
      {%- set body = _stanzas.get(proc, []) -%}
      {%- if proc not in _stanzas -%}
      {%-   set _ = bad.append({'msg': 'missing "' ~ proc ~ '"', 'parents': [], 'lines': []}) -%}
      {%- else -%}
      {%-   for line in readiness_ospf_lines if line not in body -%}
      {%-     set _ = bad.append({'msg': proc ~ ': missing "' ~ line ~ '"',
                                  'parents': [proc], 'lines': [line]}) -%}
      {%-   endfor -%}
      {#- The router-id must be the VTEP loopback: BGP takes its router-id from
          the same interface, and the two disagreeing makes a fabric very hard
          to read from a route dump. Changing it is disruptive, so it is
          reported for a human rather than emitted as a command. -#}
      {%-   if _readiness_lo0 and ('router-id ' ~ _readiness_lo0) not in body -%}
      {%-     set _ = bad.append({
                'msg': proc ~ ': router-id is not ' ~ _readiness_lo0 ~ ' (the '
                       ~ vtep_source_intf ~ ' address) -- changing it resets OSPF adjacencies',
                'parents': [], 'lines': []}) -%}
      {%-   endif -%}
      {%-   if inventory_hostname in groups.get('device_roles_fabric_border', []) -%}
      {%-     for line in readiness_ospf_border_lines if line not in body -%}
      {%-       set _ = bad.append({'msg': proc ~ ' (border): missing "' ~ line ~ '"',
                                    'parents': [proc], 'lines': [line]}) -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- fabric uplinks ----------------------------------------------------
    _uplinks: >-
      {%- set bad = [] -%}
      {%- if _readiness_uplinks | length == 0 -%}
      {%-   set _ = bad.append({
              'msg': 'no routed uplinks are enrolled in OSPF process ' ~ readiness_ospf_process
                     ~ ' -- this switch has no path into the fabric',
              'parents': [], 'lines': []}) -%}
      {%- endif -%}
      {%- for intf in _readiness_uplinks -%}
      {%-   set body = _stanzas.get('interface ' ~ intf, []) -%}
      {%-   for line in readiness_uplink_lines if line not in body -%}
      {%-     set _ = bad.append({'msg': intf ~ ': missing "' ~ line ~ '"',
                                  'parents': ['interface ' ~ intf], 'lines': [line]}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ bad | to_json }}

    # --- SNMPv3, from operational state ------------------------------------
    # IOS-XE hides snmp-server credentials from the running config. Presence
    # only; neither command reveals a password, and no command is emitted here
    # because that would put credentials in a file on disk.
    #
    # ENROLMENT-GATED. A deployment with no SNMP collector declares none in
    # deployment.yml, and gets no findings: every switch in such a fabric used
    # to report two, permanently and unfixably, for a collector that does not
    # exist -- and two unfixable findings per host is how a summary stops being
    # read at all. Same reasoning as dropping 'ip tcp window-size' above.
    #
    # The gate is the deployment's own identity file, not a run-time flag, so
    # 'not configured' cannot be produced by forgetting an -e on the command
    # line. See readiness_snmp_enrolled in defaults/main.yml.
    #
    # It is also load-bearing rather than cosmetic: snmp_v3_user and
    # snmp_v3_group are no longer required keys, so an unenrolled deployment
    # reaching the body of this block is an undefined-variable crash, not a
    # spurious finding. Removing the guard is caught by
    # tests/unit/test_optional_enrolment.py, which is where that was measured.
    _snmp: >-
      {%- set bad = [] -%}
      {%- if readiness_snmp_enrolled | bool -%}
      {%-   if snmp_v3_user not in _readiness_snmp_users -%}
      {%-     set _ = bad.append({
                'msg': 'SNMPv3 user "' ~ snmp_v3_user ~ '" not present (show snmp user)'
                       ~ ' -- run readiness.yml with readiness_apply_snmp=true to configure it',
                'parents': [], 'lines': []}) -%}
      {%-   endif -%}
      {%-   if snmp_v3_group not in _readiness_snmp_groups -%}
      {%-     set _ = bad.append({
                'msg': 'SNMPv3 group "' ~ snmp_v3_group ~ '" not present (show snmp group)',
                'parents': [], 'lines': []}) -%}
      {%-   endif -%}
      {%- endif -%}
      {{ bad | to_json }}

    # --- syslog ------------------------------------------------------------
    # Enrolment-gated like SNMPv3, but from the RUNNING CONFIG rather than
    # operational state: all three lines are rendered back, which is what lets
    # platform_baseline.j2 push them and lets them be checked as plain
    # membership. readiness_syslog_lines is empty when the deployment declares
    # no syslog_server, so this loop is the gate and needs no condition of its
    # own -- and because the SAME variable is both pushed and checked, a switch
    # cannot pass here against a different set of collectors than it was given.
    #
    # These carry commands, unlike the SNMP findings above: there is no
    # credential in a syslog line, so the remediation file can hold them.
    _syslog: >-
      {%- set bad = [] -%}
      {%- for line in readiness_syslog_lines | from_json if line not in _stanzas -%}
      {%-   set _ = bad.append({'msg': 'missing global: ' ~ line,
                                'parents': [], 'lines': [line]}) -%}
      {%- endfor -%}
      {{ bad | to_json }}

    # --- spines: anycast RP and the MSDP mesh ------------------------------
    # A one-way MSDP mesh is invisible from either device -- each switch's own
    # config looks complete -- so it can only be caught against the inventory.
    # This fabric has been bitten by it: core2 pointed at core1, core1 did not
    # point back.
    #
    # Scoped to THIS fabric's spines, not every spine in the inventory. MSDP
    # carries source-active state for the underlay anycast RP, and a separate
    # fabric has a different RP on a different underlay: a session between them
    # would be wrong even if it came up. Unscoped, this check demanded one
    # anyway, and reported every correctly-built spine as unready the moment a
    # second fabric appeared in NetBox.
    _spine: >-
      {%- set bad = [] -%}
      {%- if 'tags_fabric_spine' in group_names -%}
      {%-   set carried = [] -%}
      {%-   for name, body in _stanzas.items() if name.startswith('interface ') -%}
      {%-     for line in body if line.startswith('ip address ' ~ fabric_rp_address ~ ' ') -%}
      {%-       set _ = carried.append(name) -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%-   if carried | length == 0 -%}
      {%-     set _ = bad.append({
                'msg': 'spine: no interface carries the anycast RP address ' ~ fabric_rp_address
                       ~ ' -- the RP loopback is day-0 topology, create it deliberately',
                'parents': [], 'lines': []}) -%}
      {%-   endif -%}
      {%-   if ('ip msdp originator-id ' ~ vtep_source_intf) not in _stanzas -%}
      {%-     set _ = bad.append({'msg': 'spine: missing "ip msdp originator-id ' ~ vtep_source_intf ~ '"',
                                  'parents': [],
                                  'lines': ['ip msdp originator-id ' ~ vtep_source_intf]}) -%}
      {%-   endif -%}
      {%-   set _fabric_spines = fabric_members | default([])
                                | intersect(groups.get('tags_fabric_spine', [])) -%}
      {%-   for peer in _fabric_spines | sort if peer != inventory_hostname -%}
      {%-     set addr = hostvars[peer].get('ansible_host') -%}
      {%-     if addr and ('ip msdp peer ' ~ addr ~ ' connect-source ' ~ vtep_source_intf) not in _stanzas -%}
      {%-       set _ = bad.append({
                  'msg': 'spine: missing MSDP peer to ' ~ peer ~ ' (' ~ addr ~ ')'
                         ~ ' -- configure BOTH ends; a one-way mesh looks complete on each switch',
                  'parents': [],
                  'lines': ['ip msdp peer ' ~ addr ~ ' connect-source ' ~ vtep_source_intf]}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ bad | to_json }}
  when: _stanzas is defined

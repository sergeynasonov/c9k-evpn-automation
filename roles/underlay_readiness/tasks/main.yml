---
# Standalone entry point: run at onboarding, before the switch is ever handed to
# acm_evpn. Checks the hand-built underlay, and configures the two things this
# role owns -- SNMPv3 and the platform baseline -- in merge mode, so it adds and
# never removes.
#
# SNMPv3 and the baseline's syslog block are OPTIONAL, and enrolled by what
# group_vars/all/deployment.yml declares rather than by a flag: with the keys
# commented out neither is read, pushed, checked or reported. See
# readiness_snmp_enrolled and readiness_syslog_enrolled in defaults/main.yml.
#
#   ansible-playbook readiness.yml -e deploy_target=site_group_evpn_campus
#   ansible-playbook readiness.yml -e deploy_target=access1-1
#
# deploy_target is REQUIRED; fabric_resolve.yml refuses an unscoped run.
#
# acm_evpn imports assert_only.yml instead, which gathers and checks only.

# First, because the MSDP mesh check is scoped to the fabric and a device that
# belongs to none drops out of the play here rather than being checked against
# somebody else's spines.
- name: Resolve fabric membership
  ansible.builtin.import_tasks: fabric_resolve.yml

- name: Resolve the fabric's anycast RP
  ansible.builtin.import_tasks: fabric_anycast_rp.yml

- name: Gather underlay state
  ansible.builtin.import_tasks: 01_gather.yml

# Applying comes BEFORE checking. Several checks cover lines the baseline
# installs, so checking first would fail a switch that this very run is about to
# fix -- the same trap that had the checks blocking acm_evpn while acm_evpn
# still rendered the baseline.
- name: Configure SNMPv3 (when enrolled)
  ansible.builtin.import_tasks: 03_apply_snmp.yml

# Not part of the baseline, because the line it sets is invisible to the
# running config the baseline converges against. See 03b_apply_syslog.yml.
- name: Set the syslog trap level (when enrolled)
  ansible.builtin.import_tasks: 03b_apply_syslog.yml

- name: Apply the platform baseline
  ansible.builtin.import_tasks: 04_apply_baseline.yml

# Re-read the device so the checks judge the state we just left it in, rather
# than the state we found it in.
- name: Re-gather underlay state after configuring
  ansible.builtin.import_tasks: 01_gather.yml

- name: Check the underlay
  ansible.builtin.import_tasks: 02_check.yml

- name: Report and write remediation
  ansible.builtin.import_tasks: 05_report.yml

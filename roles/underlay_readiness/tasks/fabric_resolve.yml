---
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 Sergey Nasonov, Cisco Systems <snasonov@cisco.com>
#
# The one answer to "which fabric is this device in".
#
# A FABRIC is a NetBox SITE GROUP -- a campus of several buildings sharing one
# underlay and one iBGP ASN -- or, where a site has no site group, the SITE
# itself, which is the single-building case. Nothing else defines the boundary,
# and no new NetBox data is needed to express it: nb_inventory already creates
# 'site_group_<slug>' and 'sites_<slug>' groups, so a device's own inventory
# groups carry its fabric.
#
# Why ONE resolver rather than a site filter at each call site: every
# fabric-scoped lookup has to agree on the boundary. A peer list built from the
# site group while a validation is scoped to the site would disagree only in the
# multi-building case -- the case that is hardest to test and most expensive to
# get wrong, since a short peer list renders a 'router bgp' that 'acm replace'
# applies as a session teardown.
#
# This lives in underlay_readiness rather than acm_evpn because BOTH roles need
# it (acm_evpn for overlay peer selection, this role for the fabric-wide MSDP
# mesh check) and acm_evpn already imports from here. The reverse direction
# would make the two roles mutually dependent.
#
# Resolution reads 'groups', never hostvars or play membership: 'groups' is
# complete inventory and is populated before any task runs, so the answer is the
# same whether or not a device is in the current play. That is the same property
# filter_plugins/fabric_peers.py depends on, and for the same reason.
#
# Sets, for every host in the play:
#   fabric_map     {device: its site group or site} for the whole inventory
#   fabric_nodes   every device acm_evpn RENDERS for, inventory-wide. NOT the
#                  set this role checks: a distribution switch between a leaf
#                  and a border carries fabric traffic, so its underlay has to
#                  be fit even though nothing is rendered for it. Dropping a
#                  device for not being a fabric NODE is acm_evpn's business and
#                  happens there; task 8 below drops only what is outside
#                  fabric_managed_groups, which is wider by exactly that transit
#                  path.
#   fabric_ids     the subset of the sites/site groups that are FABRICS -- i.e. hold a fabric
#                  node. An ordinary NetBox site holding WAN kit or servers is
#                  in fabric_map but not in fabric_ids, and is asked for
#                  nothing.
#   fabric_id      this device's fabric, as an inventory group name ('' if none)
#   fabric_members every device in this device's fabric, sorted
#   fabric_asn     this fabric's iBGP ASN, from its sites in NetBox
#   fabric_scope_map  {"site:<id>"|"sitegroup:<id>": fabric} for the inventory,
#                     which is how NetBox-scoped data (VLANs) is placed in a
#                     fabric at all -- see task 12
#
# fabric_asn is resolved here rather than in acm_evpn for the same reason as the
# rest: it is a property of the fabric, from the same inventory data, and having
# two places decide it is how they come to disagree. underlay_readiness does not
# use it -- but it validates it, which catches the data error at onboarding
# rather than on the first render.

# Fabric identity is resolved in its own file: resolve_deploy_scope.yml (the
# scope play of generate_evpn.yml and deploy_evpn.yml) needs the same answer
# before the device-facing play forms, to pick the spines that belong in
# a narrowly scoped run. Imported rather than duplicated.
- name: Resolve fabric identity from inventory
  ansible.builtin.import_tasks: fabric_map.yml


# Fatal, and fatal for the whole run rather than per device: an inventory whose
# EVERY run must name what it is for. Unscoped, the host pattern defaults to
# every fabric node in the inventory -- which with more than one fabric means
# every fabric in the estate, and the operator almost never meant that. It is
# not a correctness bug (each device renders its own fabric and converges), but
# it opens a session to every switch in every building, and on a deploy it
# applies a candidate to all of them.
#
# Refused here rather than by removing the host pattern's default: without the
# default the play forms with no hosts, and Ansible's "skipping: no hosts
# matched" says nothing about why. The default exists so that this assertion is
# reachable and can explain itself.
#
# 'deploy_target=all' is accepted, because that is a deliberate act rather than
# an omission. The point is that the whole estate cannot be reached by accident.
- name: 2. Refuse a run that is not scoped to a fabric
  ansible.builtin.assert:
    that:
      - deploy_target is defined
      - deploy_target | default('') | trim | length > 0
    fail_msg: |-
      This run is not scoped. Every run must say which fabric it is for.

      Fabrics in this inventory: {{ fabric_ids | join(', ') or 'none' }}

      Add -e deploy_target=<pattern>, where <pattern> is one of:
        a fabric      -e deploy_target={{ fabric_ids | first | default('site_group_<slug>') }}
        one building  -e deploy_target=sites_<slug>
        one switch    -e deploy_target=<hostname>
        everything    -e deploy_target=all      (deliberately, not by omission)

      Unscoped, this would have targeted every fabric node in the inventory —
      every fabric in the estate, not just one — opening a session to each and,
      on a deploy, applying a candidate to all of them.
    success_msg: "run is scoped"
    quiet: true
  when: fabric_id is not defined
  run_once: true
  delegate_to: localhost

# site tree does not partition cleanly into fabrics cannot be trusted for ANY
# device's peer list, including the ones that happen to resolve.
- name: 3. Refuse an inventory that does not partition into fabrics
  ansible.builtin.assert:
    that:
      - fabric_ambiguous | length == 0
    fail_msg: |-
      The NetBox site tree does not partition into fabrics — {{ fabric_ambiguous | length }} device(s):
      {% for problem in fabric_ambiguous %}
        - {{ problem }}
      {% endfor %}
      A fabric is one site group, or one site where there is no site group.
      Nested site groups span buildings that do not share an underlay, so there
      is no safe way to choose a level here. Flatten the tree in NetBox: give
      each fabric its own top-level site group, and model anything above it as a
      region instead (regions are not used for scoping).
    success_msg: "inventory partitions into fabrics"
    quiet: true
  when: fabric_id is not defined
  run_once: true
  delegate_to: localhost

# Reported, never fatal. A device that cannot be placed is simply not part of
# any fabric -- it is left alone rather than blocking the fabrics that are fine.
# The devices themselves drop out of the play in task 7.
- name: 4. Report fabric devices that belong to no fabric
  ansible.builtin.debug:
    msg: >-
      {{ ['NetBox: device(s) ' ~ (fabric_orphans | join(', '))
          ~ ' have a fabric role or the fabric_spine tag but no site, so they'
          ~ ' belong to no fabric and are skipped — assign each a site in'
          ~ ' NetBox to bring it into one'] }}
  when:
    - fabric_id is not defined
    - fabric_orphans | length > 0
  run_once: true
  delegate_to: localhost

# The other reason a host is dropped, and the one an operator is most likely to
# be surprised by, so it is named rather than left to silence.
#
# A run scoped by site or site group selects everything in it -- servers,
# printers, wireless controllers, virtual machines -- because 'deploy_target'
# REPLACES the playbook's role-scoped default pattern rather than intersecting
# with it. Those are not devices this automation has any business contacting.
#
# Reported for the case this cannot distinguish: a transit switch modelled under
# a role name fabric_managed_groups does not list looks exactly like a printer
# from here, and silently skipping it would leave a hole in the very path
# readiness exists to cover. Widen fabric_managed_groups when that is what this
# names.
- name: 5. Report devices this automation does not act on
  ansible.builtin.debug:
    msg: >-
      {{ ['scope: ' ~ (_out_of_scope | from_json | length)
          ~ ' device(s) selected by the target but skipped — not a fabric role: '
          ~ (_out_of_scope | from_json | join(', '))
          ~ '. A switch in the fabric transit path listed here needs its device'
          ~ ' role adding to fabric_managed_groups.'] }}
  vars:
    _out_of_scope: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all | sort -%}
      {%-   if hostvars[h].group_names | intersect(fabric_managed_groups) | length == 0 -%}
      {%-     set _ = out.append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  when:
    - fabric_id is not defined
    - _out_of_scope | from_json | length > 0
  run_once: true
  delegate_to: localhost

- name: 6. Determine this device's fabric
  ansible.builtin.set_fact:
    fabric_id: "{{ fabric_map.get(inventory_hostname, '') }}"
    fabric_members: "{{ groups.get(fabric_map.get(inventory_hostname, ''), []) | sort }}"

# Ending the play for this host is what "ignored" means in practice: nothing is
# rendered for it and nothing is pushed to it, while the rest of the run
# continues. Rendering it instead would be the dangerous option -- with no
# fabric it has no peers, and an empty peer list is a session teardown.
- name: 7. Skip a device that belongs to no fabric
  ansible.builtin.meta: end_host
  when: fabric_id | length == 0

# Unguarded and per host, like task 7 above: a file-level condition would
# disable the end_host on every re-entry and silently end the skip.
#
# After the fabric skip rather than before it. Both are terminal, so for a host
# that is neither in a fabric nor in scope the order decides nothing except
# which reason an operator reads -- and "no site" is the more specific one.
- name: 8. Skip a device this automation does not act on
  ansible.builtin.meta: end_host
  when: group_names | intersect(fabric_managed_groups) | length == 0

# --- the fabric's BGP ASN ---------------------------------------------------
#
# From NetBox, and from INVENTORY rather than a query: nb_inventory fetches
# sites with the full serializer (/api/dcim/sites/?limit=0), so each device's
# 'sites[0].asns' already carries them, for every device whether or not it is in
# the play. One less round trip and one less thing to keep in step.
#
# ONE ASN PER FABRIC is definitional, not a policy choice -- the render builds
# an iBGP EVPN fabric, and every session in it is inside that ASN. So a site
# carrying two, or two sites in one fabric disagreeing, is not something to pick
# a winner from.
- name: 9. Resolve each fabric's BGP ASN from its sites
  ansible.builtin.set_fact:
    fabric_asn_map: "{{ (_asns | from_json).map }}"
    fabric_asn_problems: "{{ (_asns | from_json).problems }}"
  vars:
    _asns: >-
      {%- set out = {} -%}
      {%- set problems = [] -%}
      {%- for fabric in fabric_ids -%}
      {#-   Collect (site, asn) across every device in the fabric, so a
            disagreement can name the sites rather than just the fabric. -#}
      {%-   set seen = {} -%}
      {%-   for host in groups.get(fabric, []) -%}
      {%-     set sites = hostvars[host].get('sites') or [] -%}
      {%-     if sites | length > 0 -%}
      {%-       set site = sites[0] -%}
      {%-       set asns = (site.get('asns') or []) | map(attribute='asn')
                           | map('int') | unique | sort | list -%}
      {%-       set _ = seen.update({site.get('slug', site.get('id')): asns}) -%}
      {%-     endif -%}
      {%-   endfor -%}

      {%-   set multi = [] -%}
      {%-   for site, asns in seen | dictsort if asns | length > 1 -%}
      {%-     set _ = multi.append(site ~ ' has ' ~ (asns | join(', '))) -%}
      {%-   endfor -%}
      {%-   set distinct = seen.values() | list | flatten | unique | sort | list -%}

      {%-   if multi -%}
      {%-     set _ = problems.append(fabric ~ ': ' ~ (multi | join('; '))
                                      ~ ' -- a fabric site must carry exactly one ASN') -%}
      {%-   elif distinct | length > 1 -%}
      {%-     set _ = problems.append(fabric ~ ': its sites disagree -- '
                                      ~ (seen | dictsort | map('join', ' = ') | join('; '))) -%}
      {%-   elif distinct | length == 1 -%}
      {%-     set _ = out.update({fabric: distinct[0]}) -%}
      {%-   else -%}
      {%-     set _ = problems.append(fabric ~ ': no site in it carries an ASN object') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ {'map': out, 'problems': problems} | to_json }}
  when: fabric_asn is not defined
  run_once: true
  delegate_to: localhost

- name: 10. Refuse a fabric without exactly one BGP ASN
  ansible.builtin.assert:
    that:
      - fabric_asn_problems | length == 0
    fail_msg: |-
      {{ fabric_asn_problems | length }} fabric(s) do not have exactly one BGP ASN:
      {% for problem in fabric_asn_problems %}
        - {{ problem }}
      {% endfor %}
      Every EVPN session in a fabric is iBGP inside one ASN, so there is nothing
      to choose between two — and nothing to fall back to. In NetBox, assign ONE
      ASN object to every site in the fabric, and the same one to all of them.

      There is no global evpn_bgp_asn to stand in any more: NetBox is the only
      source for this.
    success_msg: "every fabric has exactly one BGP ASN"
    quiet: true
  when: fabric_asn is not defined
  run_once: true
  delegate_to: localhost

- name: 11. Determine this device's BGP ASN
  ansible.builtin.set_fact:
    # No fallback: task 10 has already refused any fabric without exactly one
    # ASN, so a lookup that misses can only be a device in a site that is not a
    # fabric at all -- one holding no fabric node. Nothing renders for such a
    # device, so the 0 is unreachable wherever it would matter.
    fabric_asn: "{{ fabric_asn_map.get(fabric_id, 0) | int }}"

# --- NetBox scope -> fabric -------------------------------------------------
#
# VLANs are scoped in NetBox by site or by site group, as IDs. A fabric is
# defined by inventory groups. Nothing in the VLAN data connects the two, so the
# mapping is built here, from the one place that already knows both: each
# device's own site, and the fabric the resolver put that device in.
#
# Consumed by netbox_evpn_data.py to scope VNI uniqueness per fabric. Sites with
# no devices never appear, which is correct -- a VLAN scoped to one is in scope
# for no host and renders nowhere.
- name: 12. Map each NetBox site and site group to its fabric
  ansible.builtin.set_fact:
    fabric_scope_map: "{{ _scopes | from_json }}"
  vars:
    _scopes: >-
      {%- set out = {} -%}
      {%- for host, fabric in fabric_map | dictsort -%}
      {%-   set sites = hostvars[host].get('sites') or [] -%}
      {%-   if sites | length > 0 -%}
      {%-     set site = sites[0] -%}
      {%-     if site.get('id') -%}
      {%-       set _ = out.update({'site:' ~ site.id: fabric}) -%}
      {%-     endif -%}
      {%-     if site.get('group') and site.group.get('id') -%}
      {%-       set _ = out.update({'sitegroup:' ~ site.group.id: fabric}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  when: fabric_scope_map is not defined
  run_once: true
  delegate_to: localhost

# Fatal, and fatal for the whole run: a fabric with no spine has no anycast RP
# to originate BUM replication from, and a fabric with no border has no path out
# of itself. Neither is a switch being unready -- it is the FABRIC being
# incompletely described in NetBox, so it belongs here with the other
# fabric-level refusals rather than in 02_check.yml, which judges one device at
# a time and would report the same fault on every member.
#
# Both halves are needed and neither implies the other. In this estate the two
# roles usually land on the same devices -- a campus spine is also its border --
# but that is a property of these fabrics, not of the design: the CML lab
# separates them (spine1/spine2 tagged, border1/border2 roled), which is exactly
# the shape that would let one of the two go missing unnoticed.
#
# SCOPED TO THE FABRICS THIS RUN REACHES, and per fabric rather than per site. A fabric is a site group or, where a site has
# no site group, the site itself (see the header of this file), and a building
# inside a campus fabric legitimately holds only access switches --
# sites_evpn_building_c is two leaves and nothing else. Asserting this per site
# would fail a correctly-built campus.
#
# It SUPERSEDES acm_evpn's task 17, which asserted the spine half per device.
# A fabric with no spine is now refused here, before any device is contacted and
# with a message naming the fabric rather than each stranded switch in turn, so
# task 17 can no longer fire from a missing tag. It is kept as a belt-and-braces
# assertion rather than deleted -- it costs nothing and guards the render path
# directly.
#
# LAST rather than beside tasks 2, 3 and 10 where it belongs logically. Inserting
# it there means renumbering nine tasks and the eight comments across two roles
# that name them by number, for no behavioural gain: everything in this file runs
# before any device is contacted and before fabric_anycast_rp.yml, so a fabric
# that fails here fails before the RP resolution it would also have failed, and
# with the better message.
- name: 13. Refuse a fabric without a spine and a border
  ansible.builtin.assert:
    that:
      - _incomplete | from_json | length == 0
    fail_msg: |-
      {{ _incomplete | from_json | length }} fabric(s) are incompletely built:
      {% for f in _incomplete | from_json %}
        - {{ f }}
      {% endfor %}
      A fabric needs at least one switch tagged '{{ fabric_spine_tag_group | replace('tags_', '') }}'
      and at least one switch with the fabric border role. The spine carries the
      underlay anycast RP that BUM traffic is replicated from; the border is the
      fabric's only path out of itself. Fix this in NetBox — add the tag or the
      device role — rather than here.
    success_msg: "every fabric has a spine and a border"
    quiet: true
  vars:
    _incomplete: >-
      {%- set bad = [] -%}
      {#- Only fabrics this run actually reaches. fabric_ids is inventory-wide,
          and refusing on all of it would let an incomplete lab fabric block a
          campus deploy that has nothing to do with it -- the estate-wide
          version of exactly the mistake task 2 exists to prevent. A run that
          does include the broken fabric still fails. -#}
      {%- set in_play = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   set f = fabric_map.get(h, '') -%}
      {%-   if f and f not in in_play -%}
      {%-     set _ = in_play.append(f) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for fabric in fabric_ids if fabric in in_play -%}
      {#-   Members from fabric_map rather than the inventory group, so this
            reads the same boundary every other fabric-scoped lookup does. -#}
      {%-   set members = [] -%}
      {%-   for host, f in fabric_map | dictsort if f == fabric -%}
      {%-     set _ = members.append(host) -%}
      {%-   endfor -%}
      {#- 'sort' is not decoration: Ansible's 'intersect' returns set order,
          which varies run to run, and this text goes into an operator-facing
          refusal. An unstable message is one nobody can grep a runbook for. -#}
      {%-   set spines = members
                        | intersect(groups.get(fabric_spine_tag_group, [])) | sort -%}
      {%-   set borders = members
                         | intersect(groups.get('device_roles_fabric_border', [])) | sort -%}
      {%-   if not spines and not borders -%}
      {%-     set _ = bad.append(fabric ~ ': no spine and no border') -%}
      {%-   elif not spines -%}
      {%-     set _ = bad.append(fabric ~ ': no switch is tagged fabric_spine (border(s): '
                                 ~ borders | join(', ') ~ ')') -%}
      {%-   elif not borders -%}
      {%-     set _ = bad.append(fabric ~ ': no switch has the fabric border role (spine(s): '
                                 ~ spines | join(', ') ~ ')') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ bad | to_json }}
  # UNGUARDED, unlike tasks 1-5. Their guard is 'fabric_id is not defined',
  # which task 6 sets -- so the same guard here, after task 6, is false on the
  # first pass and the assertion would never fire at all. Re-entry is already
  # prevented one level up: assert_only.yml imports this whole file only when
  # fabric_id is undefined. It reads facts task 1 published, which survive a
  # skipped task 1, so it is correct on a re-entry too.
  run_once: true
  delegate_to: localhost

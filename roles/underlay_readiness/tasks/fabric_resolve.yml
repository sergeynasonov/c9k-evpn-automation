---
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 Sergey Nasonov, Cisco Systems <snasonov@cisco.com>
#
# The one answer to "which fabric is this device in".
#
# A FABRIC is a NetBox SITE GROUP -- a campus of several buildings sharing one
# underlay and one iBGP ASN -- or, where a site has no site group, the SITE
# itself, which is the single-building case. Nothing else defines the boundary,
# and no new NetBox data is needed to express it: nb_inventory already creates
# 'site_group_<slug>' and 'sites_<slug>' groups, so a device's own inventory
# groups carry its fabric.
#
# Why ONE resolver rather than a site filter at each call site: every
# fabric-scoped lookup has to agree on the boundary. A peer list built from the
# site group while a validation is scoped to the site would disagree only in the
# multi-building case -- the case that is hardest to test and most expensive to
# get wrong, since a short peer list renders a 'router bgp' that 'acm replace'
# applies as a session teardown.
#
# This lives in underlay_readiness rather than acm_evpn because BOTH roles need
# it (acm_evpn for overlay peer selection, this role for the fabric-wide MSDP
# mesh check) and acm_evpn already imports from here. The reverse direction
# would make the two roles mutually dependent.
#
# Resolution reads 'groups', never hostvars or play membership: 'groups' is
# complete inventory and is populated before any task runs, so the answer is the
# same whether or not a device is in the current play. That is the same property
# filter_plugins/fabric_peers.py depends on, and for the same reason.
#
# Sets, for every host in the play:
#   fabric_map     {device: fabric group name} for the whole inventory
#   fabric_id      this device's fabric, as an inventory group name ('' if none)
#   fabric_members every device in this device's fabric, sorted
#   fabric_asn     this fabric's iBGP ASN, from its sites in NetBox
#   fabric_scope_map  {"site:<id>"|"sitegroup:<id>": fabric} for the inventory,
#                     which is how NetBox-scoped data (VLANs) is placed in a
#                     fabric at all -- see task 10
#
# fabric_asn is resolved here rather than in acm_evpn for the same reason as the
# rest: it is a property of the fabric, from the same inventory data, and having
# two places decide it is how they come to disagree. underlay_readiness does not
# use it -- but it validates it, which catches the data error at onboarding
# rather than on the first render.

# Tasks 1-3 are guarded so that re-entering this file is free. acm_evpn resolves
# in 01_gather_data.yml and then imports underlay_readiness as a pre-flight,
# which enters here again; readiness.yml re-gathers after configuring, likewise.
# Without the guard the orphan report below prints once per entry.
#
# The marker is 'fabric_id', which task 4 sets LAST -- not fabric_map, which
# task 1 sets and which would therefore already be defined by the time task 3
# tested for it, skipping the report on the very first pass.
#
# Tasks 4 and 5 are deliberately unguarded. They are per host and idempotent,
# and a condition covering the whole file would disable the end_host in task 5
# on every re-entry, silently ending the skip.
- name: 1. Resolve every device's fabric from inventory
  ansible.builtin.set_fact:
    fabric_map: "{{ (_resolved | from_json).map }}"
    fabric_ambiguous: "{{ (_resolved | from_json).ambiguous }}"
    fabric_orphans: "{{ (_resolved | from_json).orphans }}"
  vars:
    # Device roles and tags that make a device a fabric node. Hardcoded here as
    # they are everywhere else in both roles; a device outside all three (a
    # distribution switch, say) is site-scoped like any other but renders
    # nothing, so it is not reported when it cannot be placed.
    _fabric_node_groups:
      - device_roles_fabric_leaf
      - device_roles_fabric_border
      - tags_fabric_spine
    _resolved: >-
      {%- set sgs = {} -%}
      {%- set sites = {} -%}
      {#- One pass over the inventory, bucketing each device's site-group and
          site memberships. nb_inventory nests site_group_<parent> above
          site_group_<child> above sites_<slug>, so a device under a NESTED site
          group lands in more than one 'site_group_*' -- which is exactly how a
          nested tree is detected below. -#}
      {%- for group, members in groups | dictsort -%}
      {%-   if group.startswith('site_group_') -%}
      {%-     for host in members -%}
      {%-       set _ = sgs.update({host: sgs.get(host, []) + [group]}) -%}
      {%-     endfor -%}
      {%-   elif group.startswith('sites_') -%}
      {%-     for host in members -%}
      {%-       set _ = sites.update({host: sites.get(host, []) + [group]}) -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}

      {#- Every device that is expected to be in a fabric, so that one which
          cannot be placed is reported rather than dropped in silence. -#}
      {%- set fabric_nodes = [] -%}
      {%- for group in _fabric_node_groups -%}
      {%-   for host in groups.get(group, []) -%}
      {%-     set _ = fabric_nodes.append(host) -%}
      {%-   endfor -%}
      {%- endfor -%}

      {%- set out = {} -%}
      {%- set ambiguous = [] -%}
      {%- set orphans = [] -%}
      {%- for host in groups['all'] | sort -%}
      {%-   set host_sgs = sgs.get(host, []) -%}
      {%-   set host_sites = sites.get(host, []) -%}
      {%-   if host_sgs | length > 1 -%}
      {#-     Nested site groups are REFUSED, not resolved to the innermost one.
              The parent spans buildings that do not share an underlay, and
              picking a level here would silently decide which. -#}
      {%-     set _ = ambiguous.append(host ~ ' is in nested site groups ('
                                       ~ (host_sgs | join(', ')) ~ ')') -%}
      {%-   elif host_sites | length > 1 -%}
      {%-     set _ = ambiguous.append(host ~ ' is in more than one site ('
                                       ~ (host_sites | join(', ')) ~ ')') -%}
      {%-   elif host_sgs | length == 1 -%}
      {%-     set _ = out.update({host: host_sgs[0]}) -%}
      {%-   elif host_sites | length == 1 -%}
      {%-     set _ = out.update({host: host_sites[0]}) -%}
      {%-   elif host in fabric_nodes -%}
      {%-     set _ = orphans.append(host) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ {'map': out, 'ambiguous': ambiguous, 'orphans': orphans} | to_json }}
  when: fabric_id is not defined
  run_once: true
  delegate_to: localhost

# Fatal, and fatal for the whole run rather than per device: an inventory whose
# site tree does not partition cleanly into fabrics cannot be trusted for ANY
# device's peer list, including the ones that happen to resolve.
- name: 2. Refuse an inventory that does not partition into fabrics
  ansible.builtin.assert:
    that:
      - fabric_ambiguous | length == 0
    fail_msg: |-
      The NetBox site tree does not partition into fabrics — {{ fabric_ambiguous | length }} device(s):
      {% for problem in fabric_ambiguous %}
        - {{ problem }}
      {% endfor %}
      A fabric is one site group, or one site where there is no site group.
      Nested site groups span buildings that do not share an underlay, so there
      is no safe way to choose a level here. Flatten the tree in NetBox: give
      each fabric its own top-level site group, and model anything above it as a
      region instead (regions are not used for scoping).
    success_msg: "inventory partitions into fabrics"
    quiet: true
  when: fabric_id is not defined
  run_once: true
  delegate_to: localhost

# Reported, never fatal. A device that cannot be placed is simply not part of
# any fabric -- it is left alone rather than blocking the fabrics that are fine.
# The devices themselves drop out of the play in task 5.
- name: 3. Report fabric devices that belong to no fabric
  ansible.builtin.debug:
    msg: >-
      {{ ['NetBox: device(s) ' ~ (fabric_orphans | join(', '))
          ~ ' have a fabric role or the fabric_spine tag but no site, so they'
          ~ ' belong to no fabric and are skipped — assign each a site in'
          ~ ' NetBox to bring it into one'] }}
  when:
    - fabric_id is not defined
    - fabric_orphans | length > 0
  run_once: true
  delegate_to: localhost

- name: 4. Determine this device's fabric
  ansible.builtin.set_fact:
    fabric_id: "{{ fabric_map.get(inventory_hostname, '') }}"
    fabric_members: "{{ groups.get(fabric_map.get(inventory_hostname, ''), []) | sort }}"

# Ending the play for this host is what "ignored" means in practice: nothing is
# rendered for it and nothing is pushed to it, while the rest of the run
# continues. Rendering it instead would be the dangerous option -- with no
# fabric it has no peers, and an empty peer list is a session teardown.
- name: 5. Skip a device that belongs to no fabric
  ansible.builtin.meta: end_host
  when: fabric_id | length == 0

# --- the fabric's BGP ASN ---------------------------------------------------
#
# From NetBox, and from INVENTORY rather than a query: nb_inventory fetches
# sites with the full serializer (/api/dcim/sites/?limit=0), so each device's
# 'sites[0].asns' already carries them, for every device whether or not it is in
# the play. One less round trip and one less thing to keep in step.
#
# ONE ASN PER FABRIC is definitional, not a policy choice -- the render builds
# an iBGP EVPN fabric, and every session in it is inside that ASN. So a site
# carrying two, or two sites in one fabric disagreeing, is not something to pick
# a winner from.
- name: 6. Resolve each fabric's BGP ASN from its sites
  ansible.builtin.set_fact:
    fabric_asn_map: "{{ (_asns | from_json).map }}"
    fabric_asn_problems: "{{ (_asns | from_json).problems }}"
    fabric_asn_missing: "{{ (_asns | from_json).missing }}"
  vars:
    _asns: >-
      {%- set out = {} -%}
      {%- set problems = [] -%}
      {%- set missing = [] -%}
      {%- for fabric in fabric_map.values() | unique | sort -%}
      {#-   Collect (site, asn) across every device in the fabric, so a
            disagreement can name the sites rather than just the fabric. -#}
      {%-   set seen = {} -%}
      {%-   for host in groups.get(fabric, []) -%}
      {%-     set sites = hostvars[host].get('sites') or [] -%}
      {%-     if sites | length > 0 -%}
      {%-       set site = sites[0] -%}
      {%-       set asns = (site.get('asns') or []) | map(attribute='asn')
                           | map('int') | unique | sort | list -%}
      {%-       set _ = seen.update({site.get('slug', site.get('id')): asns}) -%}
      {%-     endif -%}
      {%-   endfor -%}

      {%-   set multi = [] -%}
      {%-   for site, asns in seen | dictsort if asns | length > 1 -%}
      {%-     set _ = multi.append(site ~ ' has ' ~ (asns | join(', '))) -%}
      {%-   endfor -%}
      {%-   set distinct = seen.values() | list | flatten | unique | sort | list -%}

      {%-   if multi -%}
      {%-     set _ = problems.append(fabric ~ ': ' ~ (multi | join('; '))
                                      ~ ' -- a fabric site must carry exactly one ASN') -%}
      {%-   elif distinct | length > 1 -%}
      {%-     set _ = problems.append(fabric ~ ': its sites disagree -- '
                                      ~ (seen | dictsort | map('join', ' = ') | join('; '))) -%}
      {%-   elif distinct | length == 1 -%}
      {%-     set _ = out.update({fabric: distinct[0]}) -%}
      {%-   else -%}
      {%-     set _ = missing.append(fabric) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ {'map': out, 'problems': problems, 'missing': missing} | to_json }}
  when: fabric_asn is not defined
  run_once: true
  delegate_to: localhost

- name: 7. Refuse a fabric whose ASN is ambiguous
  ansible.builtin.assert:
    that:
      - fabric_asn_problems | length == 0
    fail_msg: |-
      {{ fabric_asn_problems | length }} fabric(s) do not have exactly one BGP ASN:
      {% for problem in fabric_asn_problems %}
        - {{ problem }}
      {% endfor %}
      Every EVPN session in a fabric is iBGP inside one ASN, so there is nothing
      to choose between two. In NetBox, assign ONE ASN object to every site in
      the fabric, and the same one to all of them.
    success_msg: "every fabric has exactly one BGP ASN"
    quiet: true
  when: fabric_asn is not defined
  run_once: true
  delegate_to: localhost

# Deprecation, not an error: fabric.yml still supplies evpn_bgp_asn, so a fabric
# with no ASN in NetBox renders exactly as it did before. The notice is what
# makes the migration finishable -- once no fabric reports here, the fallback
# and the fabric.yml key can both go.
- name: 8. Report fabrics still using the ASN from fabric.yml
  ansible.builtin.debug:
    msg: >-
      {{ ['NetBox: fabric(s) ' ~ (fabric_asn_missing | join(', '))
          ~ ' have no ASN on their sites, so BGP falls back to evpn_bgp_asn ('
          ~ evpn_bgp_asn | default('unset') ~ ') from fabric.yml — assign an ASN'
          ~ ' object to each site in NetBox; the fallback is deprecated and will'
          ~ ' be removed'] }}
  when:
    - fabric_asn is not defined
    - fabric_asn_missing | length > 0
  run_once: true
  delegate_to: localhost

- name: 9. Determine this device's BGP ASN
  ansible.builtin.set_fact:
    # '| int' so both paths yield the same type. Without it the NetBox value and
    # the fabric.yml fallback come back differently typed, which renders the same
    # text but makes anything comparing the two behave differently depending on
    # which path a given fabric took. evpn_bgp_asn is asserted present by
    # acm_evpn, and this role does not use the ASN, so the 0 is unreachable
    # wherever it would matter.
    fabric_asn: "{{ (fabric_asn_map.get(fabric_id) or evpn_bgp_asn | default(0)) | int }}"

# --- NetBox scope -> fabric -------------------------------------------------
#
# VLANs are scoped in NetBox by site or by site group, as IDs. A fabric is
# defined by inventory groups. Nothing in the VLAN data connects the two, so the
# mapping is built here, from the one place that already knows both: each
# device's own site, and the fabric the resolver put that device in.
#
# Consumed by netbox_evpn_data.py to scope VNI uniqueness per fabric. Sites with
# no devices never appear, which is correct -- a VLAN scoped to one is in scope
# for no host and renders nowhere.
- name: 10. Map each NetBox site and site group to its fabric
  ansible.builtin.set_fact:
    fabric_scope_map: "{{ _scopes | from_json }}"
  vars:
    _scopes: >-
      {%- set out = {} -%}
      {%- for host, fabric in fabric_map | dictsort -%}
      {%-   set sites = hostvars[host].get('sites') or [] -%}
      {%-   if sites | length > 0 -%}
      {%-     set site = sites[0] -%}
      {%-     if site.get('id') -%}
      {%-       set _ = out.update({'site:' ~ site.id: fabric}) -%}
      {%-     endif -%}
      {%-     if site.get('group') and site.group.get('id') -%}
      {%-       set _ = out.update({'sitegroup:' ~ site.group.id: fabric}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  when: fabric_scope_map is not defined
  run_once: true
  delegate_to: localhost

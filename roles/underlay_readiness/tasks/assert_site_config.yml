#
# This deployment's management identity is deliberately absent from the role
# defaults, so this fails loudly rather than configuring a switch to point at an
# NTP server or an SNMP collector belonging to someone else's network.
#
# Only THIS role needs it -- it applies the platform baseline. acm_evpn requires
# nothing of the kind, so generate_evpn.yml and deploy_evpn.yml run on a fresh
# clone with no configuration at all.

- name: Deployment configuration is present
  ansible.builtin.assert:
    that:
      - _missing | from_json | length == 0
    fail_msg: |-
      Deployment configuration is incomplete — {{ _missing | from_json | length }} key(s) missing:
      {% for k in _missing | from_json %}
        - {{ k }}
      {% endfor %}
      These are THIS deployment's NTP, SNMPv3 and VTP identity — real addresses
      and names on your network — so the role ships no defaults for them.
      Create the file and fill it in:

        cp group_vars/all/deployment.yml.example group_vars/all/deployment.yml
        $EDITOR group_vars/all/deployment.yml

      deployment.yml is gitignored, so it stays yours and is never published.
    success_msg: "deployment configuration present"
    quiet: true
  vars:
    _required:
      - ntp_server_1
      - ntp_server_2
      - snmp_v3_user
      - snmp_v3_group
      - snmp_acl_name
      - snmp_acl
      - vtp_domain
    _missing: >-
      {%- set bad = [] -%}
      {%- for k in _required if k not in hostvars[inventory_hostname] -%}
      {%-   set _ = bad.append(k) -%}
      {%- endfor -%}
      {{ bad | to_json }}
  run_once: true
  delegate_to: localhost

# Two fabrics, each with its own spines and its own anycast RP.
#
#   campus  core1 + core2 under site group evpn_campus  (a two-spine mesh)
#   remote  rcore1 in a standalone site                 (a one-spine fabric)
#
# access1-1 is here to pin down that the spine block stays spine-only.

[sites_building_a]
core1     ansible_host=10.0.0.1
core2     ansible_host=10.0.0.2
access1-1 ansible_host=10.0.0.11

[sites_evpn_remote]
rcore1 ansible_host=10.1.0.1

[site_group_evpn_campus:children]
sites_building_a

[tags_fabric_spine]
core1
core2
rcore1

[device_roles_fabric_border]
core1
core2
rcore1

[device_roles_fabric_leaf]
access1-1

[all:vars]
ansible_connection=local

---
# Site-specific values -- ASNs, addresses, NTP/SNMP/VTP identity -- are NOT here.
# They live in group_vars/all/deployment.yml, which is gitignored, with a
# documented template beside it. A default pointing at somebody else's network
# is worse than no default, so the role asserts they are set instead.
#
# Expected underlay state. These are ASSERTIONS, not configuration: the underlay
# is hand-built at day 0 (see the root README) and this role never changes it.
# A failure means the switch is not fit for fabric provisioning and a human
# should fix it -- silently remediating would reintroduce exactly the risk that
# keeping the underlay device-owned was meant to avoid.
#
# SNMPv3 and syslog are the exceptions: they are the only device-facing settings
# this role configures beyond the platform baseline, only on the standalone
# path, and only when deployment.yml enrols them. See the block further down.


# Global single-line settings every fabric switch must carry.
#
# Only lines that are NOT platform defaults belong here. Absence from
# 'show running-config' means one of two things -- not configured, or
# configured as the platform default -- and a text match cannot tell them
# apart. 'ip routing' is the worked example: default-ON for the C9400/9500/9600
# so they never print it, default-off on the C9300 so it does. access2-2 (a
# C9400) reported it missing while passing every OSPF check on the same run,
# which is impossible. It is now derived instead; see 02_check.yml.
#
# Before adding a line here, check it is not a default on every platform in the
# fabric. If it might be, derive it from something observable instead.
readiness_global_lines:
  - "ip multicast-routing"
  - "ip pim register-source {{ vtep_source_intf }}"
  - "ip pim ssm default"
  - "ip pim rp-address {{ fabric_rp_address }} override"
  # ECMP hashing across the fabric uplinks. The IOS-XE default is 'universal',
  # which hashes on the OUTER header -- and for VXLAN every flow between the
  # same pair of VTEPs has an identical outer header, so the whole tunnel pins
  # to one uplink. 'include-ports source destination' brings the inner ports
  # into the hash and restores the spread.
  #
  # Safe to assert by text: 'universal' is the default, so this non-default
  # value IS rendered -- verified present in the running config of all seven
  # lab switches, C9300 through C9400. Both address families are listed because
  # platform_baseline.j2 applies both; asserting only one would let the other
  # drift silently.
  - "ip cef load-sharing algorithm include-ports source destination"
  - "ipv6 cef load-sharing algorithm include-ports source destination"

# System MTU. Checked as a FLOOR plus fabric consistency, not as an exact line,
# which is why it is not in the list above -- this used to demand "system mtu
# 9100" verbatim and failed every fabric built on any other value.
#
# 1500 + 50, and not a number of its own: VXLAN adds 50 bytes of outer
# encapsulation -- 14 Ethernet + 20 IPv4 + 8 UDP + 8 VXLAN -- on top of a
# standard 1500-byte tenant frame. Below this the underlay silently fragments
# or drops full-size tenant traffic.
#
# At or above it, the exact value is the fabric's own decision and this role
# has no business relitigating it. 9100 is the usual choice because it also
# covers jumbo tenant frames, and it is what both the remediation and
# platform_baseline.j2 propose for a switch below the floor -- but a fabric
# standardised on 1600 or 9216 is equally correct and must not be dragged
# towards it.
#
# The fabric also has to AGREE on whatever it picks, since OSPF puts the
# interface MTU in its DBD packets and refuses the adjacency when the two ends
# disagree. That is checked, but it is a secondary signal rather than the point
# of this setting: a leaf or distribution switch out of step forms no adjacency,
# so its loopback never reaches the underlay and it presents as UNREACHABLE
# rather than as an MTU finding. Borders stay reachable over their BGP handoff
# and are what the consistency branch actually catches. See the '_mtu' block in
# tasks/02_check.yml.
readiness_system_mtu_min: 1550

# Loopback0 is the VTEP source, the OSPF router-id and the PIM register source.
readiness_loopback_lines:
  - "ip pim sparse-mode"
  - "ip ospf {{ readiness_ospf_process }} area {{ readiness_ospf_area }}"

readiness_ospf_process: 1
readiness_ospf_area: 0

# 'router ospf' body. Convergence behaviour, not preference: max-metric holds
# the node out of the topology until it has converged, nsf/fast-reroute cover
# restart and failover, and bfd all-interfaces arms sub-second detection --
# which only actually runs where the interface also has 'bfd interval'.
#
# router-id is NOT listed here: it is per-device, so it is checked separately
# against the Loopback0 address read off this same switch.
readiness_ospf_lines:
  - "max-metric router-lsa include-stub summary-lsa external-lsa on-startup 60"
  - "nsf cisco"
  - "fast-reroute per-prefix enable prefix-priority low"
  - "bfd all-interfaces"

# Borders originate the default route into the fabric.
readiness_ospf_border_lines:
  - "default-information originate"

# Every fabric uplink -- any routed (non-loopback, non-SVI) interface enrolled
# in the fabric OSPF process; see 01_gather.yml for how they are discovered.
# All mandatory. 'bfd interval' is what makes 'bfd all-interfaces' do anything:
# without it the process-level statement arms nothing.
readiness_uplink_lines:
  - "no switchport"
  - "no ip redirects"
  - "no ip unreachables"
  - "no ip proxy-arp"
  - "ip pim sparse-mode"
  - "ip ospf network point-to-point"
  - "ip ospf {{ readiness_ospf_process }} area {{ readiness_ospf_area }}"
  - "load-interval 30"
  - "carrier-delay msec 0"
  - "bfd interval 250 min_rx 250 multiplier 3"
  - "hold-queue 4094 in"
  - "hold-queue 4094 out"

# Topology-driven, so a warning rather than a failure: nothing in the config is
# wrong, the area has simply grown. C9K supports 250 routers in a single area.
readiness_ospf_routers_warn: 200
readiness_ospf_routers_max: 250

# ---------------------------------------------------------------------------
# SNMPv3 and syslog: OPTIONAL, and enrolled by what deployment.yml declares
#
# Neither is needed to run a fabric, and a deployment that does not use one of
# them must not be told forever that every switch is unready for a collector it
# does not have. So enrolment is derived from the deployment's own identity file
# rather than from a run-time flag: declare the keys and the role reads, checks
# and configures it; leave them commented out and the role does not read, check,
# push or report on it at all.
#
# Everything in this block except 'readiness_apply_snmp' and the two password
# lookups is DERIVED. Do not set them -- edit group_vars/all/deployment.yml,
# which is where the decision belongs.
#
# THE UNENROLLED PATH IS VERIFIED ON HARDWARE, over the full cycle: a switch
# with both configured, run enrolled, then with all four keys commented out,
# then enrolled again. Every stage reported changed=0, and the middle stage
# skipped the SNMPv3 operational read, both apply tasks and every SNMPv3 and
# syslog check, while still reporting the switch ready.
#
# The property worth knowing, and the one measured directly rather than argued
# from ios_config's merge semantics: unenrolling REMOVES NOTHING. 'show run |
# include ^logging' and 'show snmp user' were byte-identical before and after
# -- all three logging lines and the SNMPv3 user still on the box. Commenting
# a key out stops this role managing and checking a thing; it does not
# unconfigure it. Anyone who actually wants it off the switches has to do that
# themselves.
#
# Worth testing on a device at all because of WHERE the keys come from. The
# unit tests supply them through vars_files and extra vars; a real run resolves
# them from group_vars/all, which is a different precedence layer, and that is
# the one part of this mechanism offline coverage cannot settle.
# ---------------------------------------------------------------------------

# SNMPv3 is enrolled when all three identity keys carry a value.
#
# ALL THREE, because a partial set is a typo rather than a decision.
# assert_site_config.yml fails on a partial set rather than silently disabling
# SNMP -- which is the one new failure mode this mechanism could otherwise
# introduce, and it would be invisible: a mistyped key name reads exactly like
# a deliberate opt-out.
#
# 'snmp_acl' is deliberately NOT part of the test. It is the list of permitted
# collectors, and an enrolled deployment that leaves it empty gets the group
# with no 'access' clause -- which was already the behaviour and is unchanged.
readiness_snmp_enrolled: >-
  {{ (snmp_v3_user | default('', true) | string | trim) != ''
     and (snmp_v3_group | default('', true) | string | trim) != ''
     and (snmp_acl_name | default('', true) | string | trim) != '' }}

# Permitted collectors, normalised. deployment.yml may now omit 'snmp_acl'
# entirely, so nothing downstream may reference the raw variable.
readiness_snmp_acl: "{{ snmp_acl | default([], true) }}"

# Syslog is enrolled when 'syslog_hosts' names at least one collector. A LIST,
# like snmp_acl, so a deployment with two syslog servers needs no second
# variable. Every entry must be a bare IPv4 address; assert_site_config.yml
# rejects anything else rather than quietly dropping it, for the same reason the
# SNMP triple is all-or-none.
readiness_syslog_enrolled: >-
  {{ (syslog_hosts | default([], true)) | length > 0 }}

# The syslog CLI, defined ONCE, so the template that pushes it and the check
# that verifies it cannot drift apart. JSON because an Ansible variable
# templates to a string; both consumers pipe it back through 'from_json'.
#
# All three lines ARE rendered into 'show running-config', so ios_config
# converges on them and the baseline settles at no change. That is the whole
# reason syslog lives in platform_baseline.j2 while SNMPv3 needs a task of its
# own: 'snmp-server user' is never read back, and these are.
#
# VERIFIED ON THE C9300, THE C9400 AND THE c9kv, both halves, because presence
# is not convergence:
#
#   push      a switch without them was given exactly these three lines and
#             nothing else, and passed the check on the same run
#   converge  a switch that already had them reported NO baseline change at
#             all, which is what proves the device reads them back
#
# The c9kv is the one that matters most here, and is the reason all three were
# checked rather than one. It is the platform that does NOT render 'ip tcp
# window-size', 'ip ftp passive', 'ip tftp blocksize' or interface
# 'ip proxy-arp' -- every line this baseline has had to drop for churning
# forever was found by it disagreeing with the physical switches. These three
# render everywhere, so syslog is genuinely class 1 across the fabric rather
# than class 1 on the hardware and an invisible default in the lab.
#
# The defaults predict this -- severity 'notifications' is not the default
# (informational) and facility 'syslog' is not the default (local7) -- but the
# prediction is not what it rests on. This project has been wrong about a
# platform default three times, every time by reasoning instead of looking.
#
# 'logging source-interface' is not here. It is unconditional in the baseline
# already, and it is source-interface hygiene along with the ip http / ip radius
# lines rather than part of a syslog enrolment.
readiness_syslog_lines: >-
  {%- set out = [] -%}
  {%- if readiness_syslog_enrolled | bool -%}
  {%-   set _ = out.append('logging trap notifications') -%}
  {%-   set _ = out.append('logging facility syslog') -%}
  {%-   for host in syslog_hosts -%}
  {%-     set _ = out.append('logging host ' ~ host) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ out | to_json }}

# NTP servers, in the same shape and for the same reasons as syslog_hosts and
# snmp_acl: 'ntp server' is a list-style command, so a list is what the
# deployment should be describing. This replaced ntp_server_1 / ntp_server_2,
# which fixed the number of sources at exactly two -- a deployment with three
# had nowhere to put the third, and one with a single source had to name it
# twice or invent one.
#
# REQUIRED, unlike the two optional blocks above: a fabric with no time source
# is a real fault, not a deployment that has opted out. Enforced as "the list
# names at least one", not two. Two or more is strongly preferable -- a single
# source cannot be sanity-checked and IOS will follow it wherever it goes --
# but that is the deployment's call, and this role has a history of asserting
# fabric-wide policy it has no business holding.
#
# 'ntp server' renders back into the running config verbatim, which is not an
# assumption: the baseline has been pushing these two lines all along and a
# second run reports no change, which is exactly the proof.
readiness_ntp_lines: >-
  {%- set out = [] -%}
  {%- for server in ntp_servers | default([], true) -%}
  {%-   set _ = out.append('ntp server ' ~ server) -%}
  {%- endfor -%}
  {{ out | to_json }}

# WORTH KNOWING ABOUT ALL THREE LISTS -- ntp_servers, syslog_hosts, snmp_acl.
# Every one of them drives a list-style IOS command, and ios_config MERGES. So
# ADDING an entry works and CHANGING one does not do what it looks like: the
# old address stays configured on the switch, nothing removes it, and no check
# here reports it, because every check tests for presence rather than absence.
#
# Repoint a collector and the switch logs to both, polls both, permits both,
# until somebody clears the old line by hand. Single-valued commands in this
# baseline behave the other way ('vtp domain', 'clock timezone', 'system mtu',
# the source-interface lines all replace themselves), which is what makes this
# easy to get wrong.
#
# Not fixed here, deliberately: removing a line the deployment no longer names
# means this role deleting device configuration, and it has exactly one
# mechanism for that today ('acm replace', in the other role) with a whole
# safety model around it.

snmp_v3_auth_password: "{{ lookup('env', 'ios_snmp_auth') }}"
snmp_v3_priv_password: "{{ lookup('env', 'ios_snmp_priv') }}"

# Push SNMPv3 on a deployment that is enrolled for it. This does NOT decide
# enrolment: an unenrolled deployment is not checked either, whereas setting
# this false leaves the check running against something the role was told not to
# configure. Set false to verify an enrolled deployment without touching the
# device.
#
# Syslog has no equivalent knob. It is part of the platform baseline, so
# 'readiness_apply_baseline: false' already covers it.
readiness_apply_snmp: true

# Fail on an unready switch (the deploy path). generate_evpn.yml sets this
# false so it reports the same findings and still produces the candidate.
readiness_enforce: true

# One <hostname>-readiness.cfg per unready switch, so remediating tens or
# hundreds of switches is a directory of paste-ready files rather than a scroll
# back through console output. Tracked in git but kept empty, and wiped at the
# start of every run so its contents always describe the latest run.
readiness_results_dir: "{{ playbook_dir }}/readiness-results"

# The fabric-wide CSV is a readiness-campaign artifact, so only readiness.yml
# writes it. assert_only.yml (the acm_evpn pre-flight) sets this false: a
# deploy scoped to a few switches must not replace a fabric-wide record with a
# three-row subset.
readiness_write_csv: true

# ---------------------------------------------------------------------------
# Platform baseline (templates/platform_baseline.j2)
#
# Moved here from acm_evpn: this is set once for the life of a switch, so
# rendering it on every overlay change was pure churn -- and while acm_evpn
# still rendered it, the assertions above could not honestly hard-fail on it,
# because a failure blocked the very deploy that would have installed it.
# ---------------------------------------------------------------------------

# Set false to check a switch without configuring anything at all.
readiness_apply_baseline: true

# List every line the baseline pushed, per switch, instead of just the count.
# Off by default: a first run legitimately pushes the whole baseline to every
# switch, and that is a page of correct, expected output per host burying the
# findings the run exists to produce. Turn it on when a count looks wrong:
#
#   ansible-playbook readiness.yml -e deploy_target=<fabric> \
#                                  -e readiness_show_baseline_lines=true
#
# Credential-bearing lines are counted rather than printed either way.
readiness_show_baseline_lines: false

# The device roles and tags that make a device a FABRIC NODE -- something this
# automation renders configuration for. A device outside all of these (a
# distribution switch, say) is site-scoped like any other and belongs to a
# fabric, but nothing is rendered or deployed for it: fabric_resolve.yml drops
# it from the play before any device is contacted.
#
# Named here rather than hardcoded per call site because three places need the
# same answer, and a device silently missing from one of them is the single most
# expensive kind of mistake this project can make.
#
# NOT A FLAT LIST, and it used to be -- leaf, border, tags_fabric_spine, tested
# everywhere as 'group_names | intersect(...)'. That made the TAG ALONE enough:
# tag a WAN router or a printer 'fabric_spine' and this role rendered a full
# EVPN candidate for it. The rule the estate actually runs on has a conjunction
# in it, which no list of groups can express:
#
#     fabric node  =  fabric_leaf
#                  OR fabric_border
#                  OR (distribution_switch AND tagged fabric_spine)
#
# So the ROLES that qualify on their own are named here, the promotion pair is
# named below, and the set itself -- 'fabric_nodes' -- is derived ONCE in
# fabric_resolve.yml task 1 and read by every call site. Do not reintroduce a
# per-call-site membership test; five copies of a conjunction is five chances to
# get one wrong, and the symptom is a device that silently renders nothing.
fabric_node_roles:
  - device_roles_fabric_leaf
  - device_roles_fabric_border

# The promotion pair. A distribution switch carrying the fabric_spine tag IS a
# fabric node; the same tag on anything else promotes nothing.
#
# 'tags_fabric_spine' is the only tag in the inventory that modifies a role's
# behaviour, and it does two unrelated jobs -- this promotion, and marking which
# devices get the spine-only checks (anycast RP, MSDP mesh) in 02_check.yml.
# The second job is independent of scope and is unaffected by any of this.
fabric_distribution_group: device_roles_distribution_switch
fabric_spine_tag_group: tags_fabric_spine

# Every device role this automation acts on AT ALL. Wider than the fabric-node
# rule above by exactly the transit path: nothing is rendered for a
# distribution switch, but its underlay is checked, because a wrong MTU or a
# missing PIM on a switch between a leaf and a border breaks the overlay exactly
# as it would on a leaf.
#
# This is what keeps a site-scoped run from reaching a server, a printer or a
# wireless controller that happens to share the site. The playbooks' DEFAULT
# host patterns are already role-scoped, but 'deploy_target' REPLACES the
# pattern rather than intersecting with it -- and the documented usage scopes by
# site or site group. The intersection cannot be done in the host pattern
# either: Ansible applies ':&' after every union, so a multi-term deploy_target
# silently turns the trailing terms back into unions. It is enforced as a task;
# see fabric_resolve.yml tasks 5 and 8.
#
# Widen this rather than working around it if a fabric's transit path uses a
# role this list does not name. A device dropped for being out of scope is
# REPORTED, so that case is visible rather than silent -- which is the whole
# reason the report exists.
# THREE ROLES, and 'tags_fabric_spine' is deliberately not among them. It was,
# and it was always redundant: a spine is a border or a distribution switch,
# both of which are here, so the tag never admitted a device the roles did not
# already admit. Listing it invited the reading that a tag can put a device in
# scope, which is exactly the confusion the fabric-node rule above exists to
# remove.
fabric_managed_groups:
  - device_roles_fabric_leaf
  - device_roles_fabric_border
  - device_roles_distribution_switch

# Tag(s) marking an IPAddress as a fabric's UNDERLAY anycast RP. One object per
# spine, all with the same address and role Anycast (which is what lets NetBox
# hold the duplicates), each assigned to that spine's RP loopback. See
# tasks/fabric_anycast_rp.yml. Unrelated to TRM's per-VRF tenant RPs.
underlay_anycast_rp_tags:
  - underlay_anycast_rp

# Highest VTY line number to harden, beyond the first five. Must cover every VTY
# line the platform actually has: any line left unhardened falls back to the
# IOS-XE default of 'transport input none' -- an unusable line. Check with
# 'show running-config | include ^line vty' and raise this if the platform
# instantiates more.
vty_line_max: 31


# Injected via Infisical.
local_admin_user: "{{ lookup('env', 'ios_username') }}"
local_admin_password: "{{ lookup('env', 'ios_password') }}"
# Optional pre-hashed (type 9) form of the same secret, preferred when set:
# 'secret 0 <plaintext>' is re-hashed by the device and so never matches what
# it reports back. Generate once on any switch:
#   username tmp privilege 15 secret <plaintext>
#   show running-config | include ^username tmp
local_admin_secret_hash: "{{ lookup('env', 'ios_password_secret_hash') }}"

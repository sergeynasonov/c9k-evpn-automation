---
# What this deploy is about to change, printed after the blast-radius guard and
# immediately before anything touches a device.
#
# DEPLOY ONLY. generate_evpn.yml does not run this: that playbook's output IS
# the rendered candidate in switch-configuration/, which the operator diffs
# directly. A console summary there duplicates the artifact, worse.
#
# There was a NetBox-hygiene report beside this one, listing VLANs that produce
# no configuration. It is gone: enrolment is opt-in, so a VLAN that has not
# opted in is not a finding, and the deprecation notices it also carried went
# with the fallbacks they were counting down.
#
# Two rules learned from the first version:
#
#  * 'msg' is a LIST of strings, not one multi-line string. The default callback
#    renders a multi-line string as one JSON blob full of \n escapes -- and
#    'result_format = yaml' in ansible.cfg does not take effect (only the
#    ANSIBLE_CALLBACK_RESULT_FORMAT env var does), so the readable form has to
#    be built rather than configured.
#
#  * Only NOTABLE things are listed. A converged fabric prints one line. Detail
#    that appears on every run stops being read, which is how the per-host debug
#    tasks this replaced ended up as scroll.

- name: Summarise what this deploy will change
  ansible.builtin.debug:
    msg: "{{ _lines | from_json }}"
  vars:
    _hosts: "{{ ansible_play_hosts | sort }}"
    # A host that fails before rendering is REMOVED from ansible_play_hosts, so
    # iterating that alone reports on the survivors and says nothing about the
    # rest. access1-1 timed out fetching its running config and simply vanished
    # from a seven-switch summary. At 500 switches a single fatal: line is lost
    # in the scroll, and a silently skipped switch keeps its old config while
    # the fabric is believed consistent.
    #
    # But only hosts this run was going to RENDER count as missing. A host
    # pattern also selects devices this role renders nothing for -- ':' is a
    # union, so a site-scoped deploy_target picks up that site's distribution
    # switches -- and they are dropped on purpose, before any device is touched,
    # and named once already by 02_render_configs.yml. Counting them here
    # reported four healthy switches as "failed before a candidate was built",
    # which is alarming and false. Same mistake the readiness summary made; see
    # underlay_readiness/tasks/05_report.yml.
    #
    # THE SPINES ARE THE SAME MISTAKE ONE LAYER OUT, and the first fix missed
    # them because they ARE fabric nodes -- of a fabric this run is not
    # targeting. deploy_evpn.yml used to union tags_fabric_spine in
    # estate-wide (a spine left out of the play keeps a stale peer list), so a
    # campus deploy always selected the CML spines, and 01_gather_data.yml task
    # 15a always dropped them. Reporting that as a failure meant every single
    # campus run printed two switches as broken when nothing was wrong. The
    # scope play no longer selects them, but a hand-written pattern still can.
    # 'acm_fabric_not_targeted' is set by the task that makes the decision.
    _missing: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all | sort
            if h not in ansible_play_hosts and h in fabric_nodes
               and not hostvars[h].acm_fabric_not_targeted | default(false) -%}
      {%-   set _ = out.append(h) -%}
      {%- endfor -%}
      {{ out | to_json }}
    _lines: >-
      {%- set out = [] -%}
      {%- set notable = [] -%}

      {#- Per host: pruning, blast-radius findings and trunk growth. Object
          counts are shown only when non-zero -- '+0 / -0' on every switch was
          noise that buried the two lines that mattered. -#}
      {%- for h in _hosts -%}
      {%-   set stale = hostvars[h].stale_headers | default([]) -%}
      {%-   set viol = hostvars[h]._acm_violations | default([]) -%}
      {%-   set trunks = hostvars[h].trunk_vlan_delta | default({}) -%}
      {%-   set d = hostvars[h].acm_census_delta | default({}) -%}
      {%-   set ns = namespace(add=0, rem=0) -%}
      {%-   for _k, v in d.items() -%}
      {%-     set ns.add = ns.add + [0, (v.after | int) - (v.before | int)] | max -%}
      {%-     set ns.rem = ns.rem + (v.removed_count | int) -%}
      {%-   endfor -%}
      {%-   set bits = [] -%}
      {%-   if ns.add or ns.rem -%}
      {%-     set _ = bits.append('+' ~ ns.add ~ ' / -' ~ ns.rem ~ ' objects') -%}
      {%-   endif -%}
      {%-   if stale -%}
      {%-     set _ = bits.append('PRUNE ' ~ (stale | join(', '))) -%}
      {%-   endif -%}
      {%-   set departed = (hostvars[h].acm_bgp_unrendered | default({})).departed | default([]) -%}
      {%-   if departed -%}
      {%-     set _ = bits.append('BGP PEER GONE FROM NETBOX ' ~ (departed | join(', '))) -%}
      {%-   endif -%}
      {#- Only trunks that change. The render emits a full allowed list every
          run, so printing that list would put an identical line on every border
          on every deploy. -#}
      {%-   for intf, d in trunks.items() -%}
      {%-     set parts = [] -%}
      {%-     if d.add -%}{% set _ = parts.append('+' ~ (d.add | join(','))) %}{%- endif -%}
      {%-     if d.drop -%}{% set _ = parts.append('-' ~ (d.drop | join(','))) %}{%- endif -%}
      {%-     set _ = bits.append('trunk ' ~ intf ~ ' ' ~ (parts | join(' '))) -%}
      {%-   endfor -%}
      {%-   for v in viol -%}
      {%-     set _ = bits.append('BLAST RADIUS ' ~ v.klass ~ ' -' ~ v.removed_count
                                  ~ ' (' ~ v.removed_pct ~ '%)') -%}
      {%-   endfor -%}
      {%-   if bits -%}
      {%-     set _ = notable.append(h) -%}
      {%-     set _ = out.append('  ' ~ '%-14s' | format(h) ~ (bits | join('; '))) -%}
      {%-   endif -%}
      {%- endfor -%}

      {%- set quiet = _hosts | length - notable | length -%}
      {%- set missing = _missing | from_json -%}
      {#- Listed FIRST and unconditionally: a switch that produced no candidate
          is the one thing here that silently leaves the fabric inconsistent. -#}
      {%- if missing -%}
      {%-   set _ = out.insert(0, '  NOT RENDERED (' ~ missing | length ~ '): '
                               ~ (missing | join(', '))
                               ~ ' — failed before a candidate was built; these'
                               ~ ' switches will NOT be deployed to') -%}
      {%- endif -%}
      {%- set _ = out.insert(0, 'EVPN deploy — ' ~ ansible_play_hosts_all | length
                             ~ ' switch(es) targeted, ' ~ _hosts | length
                             ~ ' rendered, nothing applied yet') -%}
      {%- if quiet -%}
      {%-   set _ = out.append('  ' ~ quiet ~ ' switch(es) with no pending object changes') -%}
      {%- endif -%}

      {{ out | to_json }}
  run_once: true
  delegate_to: localhost

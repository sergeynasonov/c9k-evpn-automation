---
# Deprecation notices about NetBox data, reported on BOTH the generate and
# deploy paths.
#
# Only about objects that HAVE opted into the fabric. Enrolment is opt-in
# throughout this project -- a VLAN with no scope, or with no recognised role,
# has not opted in, and a NetBox legitimately holds hundreds of those: other
# platforms, other teams, decommissioned ranges, documentation-only IPAM
# entries. They used to be listed here on every run, which is noise about
# objects that are none of this automation's business. They are ignored in
# silence now.
#
# What remains is the opposite case: an object that IS a fabric segment but is
# still relying on a deprecated fallback, which the operator has to act on
# before that fallback is removed.
#
# Stated once, fabric-wide, since these are properties of NetBox rather than of
# any device.

- name: Report NetBox objects still relying on a deprecated fallback
  ansible.builtin.debug:
    msg: "{{ _lines | from_json }}"
  vars:
    _hosts: "{{ ansible_play_hosts }}"
    _lines: >-
      {%- set out = [] -%}
      {#- Handoffs still riding the global evpn_ext_bgp_asn. Reported per VLAN
          rather than per host: it is a property of NetBox, and the same handoff
          appears on both borders of a dual-homed pair. -#}
      {%- set no_asn = [] -%}
      {%- for vrf_name, vrf in (hostvars[_hosts[0]].netbox_vlan_groups
                                | default({})).get('vrfs', {}) | dictsort -%}
      {%-   for vid, vlan in vrf.get('handoff_vlans', {}) | dictsort(by='key')
              if not vlan.get('upstream_asn') -%}
      {%-     set _ = no_asn.append(vid ~ ' (' ~ vrf_name ~ ')') -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- if no_asn -%}
      {%-   set _ = out.append('NetBox: L3 handoff VLAN(s) ' ~ (no_asn | join(', '))
                               ~ ' carry no upstream_asn, so the eBGP session falls'
                               ~ ' back to evpn_ext_bgp_asn (' ~ evpn_ext_bgp_asn ~ ')'
                               ~ ' from fabric.yml -- set upstream_asn on the VLAN;'
                               ~ ' the fallback is deprecated and will be removed') -%}
      {%- endif -%}
      {{ out | to_json }}
  when: _lines | from_json | length > 0
  run_once: true
  delegate_to: localhost

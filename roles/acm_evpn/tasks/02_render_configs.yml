---
# Build the candidate config: the fabric block we own, plus everything on the
# device we do not.
#
# Ownership is DERIVED, not declared. The managed set is the top-level stanza
# headers our own render emits (see candidate_config.j2), so it cannot drift
# from what we actually push and there is no allowlist to maintain. The former
# model did the opposite -- extract what to keep, delete the rest -- and that
# allowlist repeatedly fell behind reality: it silently dropped switchports,
# L3 port-channel members, SVIs in non-fabric VRFs, and every IOS-XE platform
# default the templates did not model.
#
# Two hand-written rules sit on top:
#   * the fabric NAMESPACES below, so an object NetBox has dropped is pruned
#     rather than preserved forever;
#   * candidate_omit_regex / candidate_prefix_managed in defaults.

# A host pattern can select devices this role renders nothing for: ':' is a
# UNION, so '-e deploy_target=<site>' selects every device in that site,
# distribution switches included. Ansible applies ':&' intersections AFTER every
# union regardless of position, so this cannot be a host pattern without also
# intersecting away the spines the pattern deliberately unions in.
#
# Dropped HERE rather than in the resolver, and the placement is the point: the
# underlay_readiness pre-flight runs before this, and it MUST see these devices.
# A distribution switch sitting between a fabric leaf and a fabric border
# carries fabric traffic, so a wrong MTU or a missing PIM on it breaks the
# overlay exactly as a leaf would -- it just has no overlay config of its own.
# Check everything in the path; render only for fabric nodes.
- name: R1. Report targeted devices this role renders nothing for
  ansible.builtin.debug:
    msg: >-
      {{ ['Rendering nothing for ' ~ (_not_ours | from_json | length) ~ ' targeted'
          ~ ' device(s) that are not fabric nodes: ' ~ (_not_ours | from_json | join(', '))
          ~ ' — they carry no fabric role and no fabric_spine tag. Their underlay'
          ~ ' was still checked; only the overlay render is skipped'] }}
  vars:
    _not_ours: >-
      {%- set out = [] -%}
      {%- for host in ansible_play_hosts | sort
            if groups['all'] and host not in fabric_nodes -%}
      {%-   set _ = out.append(host) -%}
      {%- endfor -%}
      {{ out | to_json }}
  when: _not_ours | from_json | length > 0
  run_once: true
  delegate_to: localhost

# 'fabric_nodes', not a group intersection: R1 above already reports from
# that set, and the two tests being written differently one line apart is
# how they come to disagree. The rule behind it has a conjunction in it --
# see fabric_node_roles in underlay_readiness/defaults/main.yml.
- name: R2. Skip a device this role renders nothing for
  ansible.builtin.meta: end_host
  when: inventory_hostname not in fabric_nodes

- name: Remove previously rendered candidate configs
  ansible.builtin.file:
    path: "{{ playbook_dir }}/switch-configuration"
    state: absent
  run_once: true
  delegate_to: localhost

- name: Recreate clean candidate-config directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/switch-configuration"
    state: directory
    mode: '0755'
  run_once: true
  delegate_to: localhost

- name: Ensure ACM results directory exists (tracked in git, kept empty)
  ansible.builtin.file:
    path: "{{ playbook_dir }}/commit-results"
    state: directory
    mode: '0755'
  run_once: true
  delegate_to: localhost

# Clear the previous run's results WITHOUT deleting the directory itself, so the
# tracked-but-empty commit-results/ folder (and its .gitignore keeper) survives.
- name: Find stale ACM result files (excluding the directory keeper)
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/commit-results"
    excludes:
      - ".gitignore"
  register: _stale_results
  run_once: true
  delegate_to: localhost

- name: Remove stale ACM result files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _stale_results.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  run_once: true
  delegate_to: localhost

# The leaf template is the FALL-THROUGH, so anything that is neither a border
# nor a spine is rendered as a leaf. That is right for a leaf and catastrophic
# for anything else: a distribution switch selected by a site-scoped
# deploy_target would be handed a full EVPN leaf configuration and have it
# applied by 'acm replace'.
#
# The end_host at the top of this file drops such devices before this runs, so
# this assertion should never fire. It is here because "should never" is exactly
# what was true of the union bug until it was looked at, and the cost of being
# wrong is a wrong full-config replacement on a switch nobody meant to touch.
- name: Refuse to render a device that is not a fabric node
  ansible.builtin.assert:
    that:
      - inventory_hostname in fabric_nodes
    fail_msg: >-
      {{ inventory_hostname }} is not a fabric node — it is not a fabric leaf
      or border, and not a distribution switch tagged fabric_spine — so this
      role renders nothing for it, but it reached the render step, which means
      it was not dropped from the play as it should have been.
      Refusing rather than falling through to the leaf template, which would
      hand it a full EVPN configuration.
    quiet: true

- name: Render the fabric block (the config this role owns)
  ansible.builtin.set_fact:
    fabric_config: >-
      {{ lookup('template',
                'border_config.j2' if inventory_hostname in groups.get('device_roles_fabric_border', [])
                else ('spine_config.j2' if inventory_hostname in groups.get('tags_fabric_spine', [])
                      else 'leaf_config.j2')) }}

# Which fabric objects exist ON THIS DEVICE? Read from the device's own config,
# so it includes objects NetBox has since dropped -- exactly what has to be
# pruned rather than preserved.
- name: Inventory the fabric objects on the device and in the render
  ansible.builtin.set_fact:
    _dev_evi_vlans: "{{ _run | regex_findall('(?m)^l2vpn evpn instance (\\d+)') }}"
    _dev_cfg_vlans: "{{ _run | regex_findall('(?m)^vlan configuration (\\d+)') }}"
    _dev_fabric_vrfs: "{{ _run | regex_findall('(?m)^\\s+member vni \\d+ vrf (\\S+)') }}"
    _new_evi_vlans: "{{ fabric_config | regex_findall('(?m)^l2vpn evpn instance (\\d+)') }}"
    _new_cfg_vlans: "{{ fabric_config | regex_findall('(?m)^vlan configuration (\\d+)') }}"
    _new_fabric_vrfs: "{{ fabric_config | regex_findall('(?m)^\\s+member vni \\d+ vrf (\\S+)') }}"
  vars:
    # ONLY genuine task-local values belong here. A 'vars:' entry is scoped to
    # this task, so anything a later task reads must be under set_fact -- which
    # is exactly how merging these two inventories first went wrong: the _new_*
    # keys landed under vars: and were Undefined by the next task.
    _run: "{{ current_run_config.stdout[0] }}"

# A tenant SVI cannot be classified from its header -- 'interface Vlan500' looks
# identical whether it is an orphaned CORP SVI or an underlay handoff. The
# difference is 'vrf forwarding <a fabric VRF>' in the body, so walk the stanzas
# once to find them.

- name: Find tenant SVIs belonging to fabric VRFs
  ansible.builtin.set_fact:
    _dev_fabric_svis: >-
      {%- set fabric = (_dev_fabric_vrfs + _new_fabric_vrfs) | unique -%}
      {%- set found = [] -%}
      {%- set ns = namespace(cur='') -%}
      {%- for line in current_run_config.stdout[0].splitlines() -%}
      {%-   if line.startswith('interface Vlan') -%}
      {%-     set ns.cur = line[14:] | trim -%}
      {%-   elif not line.startswith(' ') -%}
      {%-     set ns.cur = '' -%}
      {%-   elif ns.cur and line.strip().startswith('vrf forwarding ') -%}
      {%-     if line.strip()[15:] | trim in fabric -%}
      {%-       set _ = found.append(ns.cur) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ found | unique }}

# Stale = on the device, inside a fabric namespace, absent from the render.
# Without this, preserve-by-default would become preserve-forever.
# TRM pruning. Under preserve-by-default, anything this role stops rendering is
# carried forward from the device -- so a VRF that is un-marked for multicast
# would keep its RP loopback, 'ip multicast-routing vrf X' and every 'ip pim
# vrf X' line forever, and disabling TRM would be a one-way door.
#
# Detection is by consequence, not by comparing NetBox state: a VRF has TRM on
# the DEVICE if the device carries 'ip multicast-routing vrf <name>', and it
# keeps it if the RENDER carries the same line. Everything on the device and not
# in the render is stale. That works whether TRM was switched off, or the whole
# VRF was removed from the fabric.
- name: Find TRM configuration to prune from VRFs no longer multicast-enabled
  ansible.builtin.set_fact:
    trm_stale_vrfs: "{{ _stale | from_json }}"
    stale_prefixes: "{{ _prefixes | from_json }}"
    trm_stale_loopbacks: "{{ _loopbacks | from_json }}"
  vars:
    # '\S+' stops at the trailing space IOS-XE renders on this line.
    _dev: "{{ current_run_config.stdout[0] | regex_findall('(?m)^ip multicast-routing vrf (\\S+)') }}"
    _new: "{{ fabric_config | regex_findall('(?m)^ip multicast-routing vrf (\\S+)') }}"
    _stale: "{{ (_dev | unique | difference(_new)) | to_json }}"
    _prefixes: >-
      {%- set out = [] -%}
      {%- for vrf in _dev | unique | difference(_new) -%}
      {%-   set _ = out.append('ip multicast-routing vrf ' ~ vrf) -%}
      {%-   set _ = out.append('ip pim vrf ' ~ vrf ~ ' ') -%}
      {%- endfor -%}
      {{ out | to_json }}
    # The RP loopback carries no marker of its own, so it is found by walking
    # the stanza for 'vrf forwarding <stale vrf>'. Restricted to Loopback
    # numbers in the L3VNI range, so an operator's own loopback in the same VRF
    # is never touched -- this role only ever creates Loopback<l3vni>.
    _loopbacks: >-
      {%- set stale = _dev | unique | difference(_new) -%}
      {%- set out = [] -%}
      {%- set ns = namespace(cur='', num=0) -%}
      {%- for line in current_run_config.stdout[0].splitlines() -%}
      {%-   if line.startswith('interface Loopback') -%}
      {%-     set ns.cur = line | trim -%}
      {%-     set ns.num = (line | trim)[18:] | int(0) -%}
      {%-   elif not line.startswith(' ') -%}
      {%-     set ns.cur = '' -%}
      {%-   elif ns.cur and line.strip().startswith('vrf forwarding ') -%}
      {%-     if line.strip()[15:] in stale
                and ns.num > (evpn_l3vni_base | int)
                and ns.num <= (evpn_l3vni_base | int) + 254 -%}
      {%-       set _ = out.append(ns.cur) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | unique | to_json }}

- name: Work out what to prune and what to add to the handoff trunk
  ansible.builtin.set_fact:
    stale_headers: >-
      {%- set out = [] -%}
      {%- for vid in (_dev_evi_vlans | difference(_new_evi_vlans)) -%}
      {%-   set _ = out.append('l2vpn evpn instance ' ~ vid ~ ' vlan-based') -%}
      {%- endfor -%}
      {%- for vid in (_dev_cfg_vlans | difference(_new_cfg_vlans)) -%}
      {%-   set _ = out.append('vlan configuration ' ~ vid) -%}
      {%- endfor -%}
      {#- A VLAN the render still emits is NOT gone, however it emits it. A
          HANDOFF VLAN is the case that matters: border_config.j2 renders
          'vlan 197' and 'interface Vlan197' but never an EVI or a 'vlan
          configuration', because a handoff carries no VNI -- so measuring
          "gone" by EVI/vlan-configuration alone declared every handoff stale on
          every run. Harmless in the candidate (the managed set drops those two
          headers anyway and the template re-emits them, which is why ACM
          reported no diff) but it put a PRUNE line in the pre-deploy summary
          for objects nothing was pruning. A summary that cries wolf is worse
          than no summary. -#}
      {%- set _new_vlan_defs = fabric_config | regex_findall('(?m)^vlan ([0-9]+)$') -%}
      {%- set gone_vlans = (_dev_evi_vlans + _dev_cfg_vlans + _dev_fabric_svis) | unique
                           | difference(_new_evi_vlans + _new_cfg_vlans + _new_vlan_defs) -%}
      {#- The SVI is pruned only where the device HAD one; the 'vlan <id>'
          definition is pruned for every gone fabric VLAN.

          These were one condition until an L2-only overlay was un-tagged from a
          border. That segment has no SVI by definition, so it never matched
          'vid in _dev_fabric_svis': ACM removed its EVPN instance, its 'vlan
          configuration' and its NVE member, while 'vlan 104' survived as a
          preserved orphan. Half a teardown.

          Safe because gone_vlans only ever contains VLANs the device carried as
          an EVPN instance, a 'vlan configuration', or a fabric SVI -- all
          unambiguously fabric-owned. A hand-configured access VLAN is in none of
          those sets and is never touched. -#}
      {%- for vid in gone_vlans -%}
      {%-   if vid in _dev_fabric_svis -%}
      {%-     set _ = out.append('interface Vlan' ~ vid) -%}
      {%-   endif -%}
      {%-   set _ = out.append('vlan ' ~ vid) -%}
      {%- endfor -%}
      {%- for vrf in (_dev_fabric_vrfs | difference(_new_fabric_vrfs)) -%}
      {%-   set _ = out.append('vrf definition ' ~ vrf) -%}
      {%- endfor -%}
      {#- RP loopbacks of VRFs that lost TRM; see the task above. -#}
      {%- for lo in trm_stale_loopbacks | default([]) -%}
      {%-   set _ = out.append(lo) -%}
      {%- endfor -%}
      {{ out | unique }}

# THE HANDOFF TRUNK'S ALLOWED-VLAN LIST, RENDERED IN FULL.
#
# It used to emit 'switchport trunk allowed vlan add <missing>' and, briefly, a
# matching 'remove'. Both are IMPERATIVE: they describe a transition, so they
# only do anything if the render happens to be present at the moment the change
# occurs. Tearing VRF SECURITY down on 2026-08-23 proved the cost -- the
# teardown was clean everywhere else, 397 stayed permitted on core1's trunk
# because no removal existed yet, and by the following deploy 'interface
# Vlan397' was gone, so an SVI-based test could never match it again. The entry
# was orphaned permanently by a repair that only worked during the event.
#
# A FINAL LIST IS STATE, and ACM is a configuration replacement -- give it the
# list this trunk should carry and let it work out the delta. Additions and
# removals both fall out for free, and the result is self-healing: whatever the
# trunk looks like now, the next deploy reconciles it.
#
# desired = (what is on the trunk AND still in the device's VLAN database,
#            minus fabric VLANs the render has dropped)
#           + (the handoff VLANs this device renders)
#
# Each term earns its place. The database test drops an entry for a VLAN that no
# longer exists -- which is exactly 397's state now, so it self-repairs without
# anyone touching the switch. The 'gone' term catches the same VLAN one run
# EARLIER, while its SVI is still being pruned. And keeping everything else the
# trunk carries is what protects the underlay VLAN and any hand-configured one:
# 98 is in the device's database and is not a fabric SVI, so it survives both
# tests. Nothing is dropped for being unrecognised.
    _trunk_state: >-
      {%- set handoff = [] -%}
      {%- for _vrf, vrf_data in netbox_vlan_groups.vrfs.items() -%}
      {%-   for vid, vlan in vrf_data.handoff_vlans.items() if inventory_hostname in vlan.tags -%}
      {%-     set _ = handoff.append(vid | int) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- set _new_defs = fabric_config | regex_findall('(?m)^vlan ([0-9]+)$')
                          | map('int') | list -%}
      {#- THE VLAN DATABASE, and it is not one VLAN per line on every release.
          IOS writes 'vlan 98 ' with a trailing space on some, and collapses
          unnamed VLANs into 'vlan 98,700,701' or 'vlan 100-102' on others.
          Only the first form was parsed.

          This list is what KEEPS a VLAN on the trunk, so a spec it fails to
          read is a VLAN dropped from the allowed list. Fail to read them all
          -- which one comma would do -- and 'keep' is empty, 'desired'
          collapses to the handoff VLANs alone, and the render emits a trunk
          without the underlay VLAN the border is managed over. Not observed on
          C9300/IOS-XE 17.x, where every VLAN gets its own line; parsed properly
          because the cost of being wrong is the management path.

          'vlan configuration 399' cannot match -- it has letters. The '-' sits
          first in the class so it needs no escaping. -#}
      {%- set _dev_defs = [] -%}
      {%- for spec in current_run_config.stdout[0]
                      | regex_findall('(?m)^vlan ([0-9][-0-9, ]*?)\\s*$') -%}
      {%-   for part in spec.split(',') -%}
      {%-     set bounds = part | trim -%}
      {%-     if '-' in bounds -%}
      {%-       for v in range(bounds.split('-')[0] | int,
                               (bounds.split('-')[1] | int) + 1) -%}
      {%-         set _ = _dev_defs.append(v) -%}
      {%-       endfor -%}
      {%-     elif bounds -%}
      {%-       set _ = _dev_defs.append(bounds | int) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- set gone = _dev_fabric_svis | map('int') | list
                     | difference(handoff) | difference(_new_defs) -%}
      {%- set underlay_svis = (current_run_config.stdout[0]
            | regex_findall('(?m)^interface Vlan(\\d+)'))
            | difference(_dev_fabric_svis) | map('int') | list -%}
      {#- IOS wraps a long allowed list onto continuation lines ('...allowed vlan
          1,2,3' then '...allowed vlan add 4,5'), so accumulate per interface
          rather than reading a single line. Taking only the last one would see
          a fraction of the trunk and delete the rest. -#}
      {%- set seen = {} -%}
      {%- set ns = namespace(cur='') -%}
      {%- for line in current_run_config.stdout[0].splitlines() -%}
      {%-   if line.startswith('interface ') -%}
      {%-     set ns.cur = line[10:] | trim -%}
      {%-   elif not line.startswith(' ') -%}
      {%-     set ns.cur = '' -%}
      {%-   elif ns.cur and line.strip().startswith('switchport trunk allowed vlan ') -%}
      {%-     set spec = line.strip()[30:] | replace('add ', '') -%}
      {%-     set vids = spec.split(',') | map('trim') | select('match', '^\\d+$')
                         | map('int') | list -%}
      {%-     set _ = seen.update({ns.cur: seen.get(ns.cur, []) + vids}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- set out = {} -%}
      {%- for intf, on_trunk in seen.items() -%}
      {#- Only a trunk carrying an underlay SVI's VLAN is a handoff trunk.
          Without this the render would claim every trunk on the box. -#}
      {%-   if on_trunk | intersect(underlay_svis) | length > 0 -%}
      {%-     set keep = on_trunk | intersect(_dev_defs) | difference(gone) -%}
      {%-     set desired = (keep + handoff) | unique | sort -%}
      {%-     if desired | length > 0 -%}
      {%-       set _ = out.update({intf: {
                    'now': on_trunk | unique | sort,
                    'desired': desired,
                    'add': desired | difference(on_trunk) | sort,
                    'drop': on_trunk | unique | difference(desired) | sort}}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

# Two views of that one scan: the list the template renders, and -- for the
# pre-deploy summary -- only the trunks that actually change. The summary used
# to print the additions, which were empty in the steady state; a full list
# printed unconditionally would put an identical line on every border on every
# run and bury the entries that matter.
- name: Split the trunk state into the render list and the change summary
  ansible.builtin.set_fact:
    trunk_vlan_final: >-
      {%- set out = {} -%}
      {%- for intf, st in _trunk_state.items() -%}
      {%-   set _ = out.update({intf: st.desired}) -%}
      {%- endfor -%}
      {{ out }}
    trunk_vlan_delta: >-
      {%- set out = {} -%}
      {%- for intf, st in _trunk_state.items() if st.add or st.drop -%}
      {%-   set _ = out.update({intf: {'add': st.add, 'drop': st.drop}}) -%}
      {%- endfor -%}
      {{ out }}

# Stale objects are reported per host by 03b_predeploy_summary.yml.

- name: Render the full IOS-XE candidate configuration
  ansible.builtin.template:
    src: candidate_config.j2
    dest: "{{ playbook_dir }}/switch-configuration/{{ inventory_hostname }}-candidate-config.cfg"
    newline_sequence: '\n'  # Ensures correct newlines for VS Code review
    # 0600, not the 0644 used elsewhere: until 05_redact_local.yml runs, this
    # file is a complete copy of a live switch's configuration, secrets included.
    mode: '0600'
  delegate_to: localhost

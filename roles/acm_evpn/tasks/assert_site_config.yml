#
# Site configuration is deliberately absent from the role defaults, so this
# fails loudly rather than rendering against a plausible-looking value that
# belongs to someone else's network.

- name: Site configuration is present
  ansible.builtin.assert:
    that:
      - _missing | from_json | length == 0
    fail_msg: |-
      Site configuration is incomplete — {{ _missing | from_json | length }} key(s) missing:
      {% for k in _missing | from_json %}
        - {{ k }}
      {% endfor %}
      These describe YOUR fabric (ASNs, addressing, NTP/SNMP/VTP identity), so
      the roles ship no defaults for them. Create the file and fill it in:

        cp group_vars/all/fabric.yml.example group_vars/all/fabric.yml
        $EDITOR group_vars/all/fabric.yml

      fabric.yml is gitignored, so it stays yours and is never published.
    success_msg: "site configuration present"
    quiet: true
  vars:
    # The fabric ASN, the upstream ASN and the anycast RP were all here once.
    # They now come from NetBox with no fallback, so requiring them in fabric.yml
    # would demand a value nothing reads.
    _required:
      - vtep_source_intf
    _missing: >-
      {%- set bad = [] -%}
      {%- for k in _required if k not in hostvars[inventory_hostname] -%}
      {%-   set _ = bad.append(k) -%}
      {%- endfor -%}
      {{ bad | to_json }}
  run_once: true
  delegate_to: localhost

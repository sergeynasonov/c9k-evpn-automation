# fabric_multi.ini plus non-switches INSIDE fabric sites, the way a real
# NetBox models them: a server and a printer share the campus buildings, and a
# WAN router is (wrongly) tagged fabric_spine. A site-scoped deploy_target
# selects all three; none of them is anything this automation acts on.
#
# Two fabrics, shaped the way nb_inventory builds them: 'sites_<slug>' groups
# hold the devices, and 'site_group_<slug>' groups hold the sites as children.
#
#   fabric A  site group evpn_campus, spanning buildings a and b
#   fabric B  site evpn_remote, a standalone building with no site group
#   orphan1   a fabric leaf with no site at all
#   dist1     in a fabric, but not a fabric node -- it renders nothing

[sites_building_a]
core1     ansible_host=10.0.0.1
core2     ansible_host=10.0.0.2
access1-1 ansible_host=10.0.0.11
dist1     ansible_host=10.0.0.90
ubuntu1   ansible_host=10.0.0.201
edge-wan  ansible_host=10.0.0.250

[sites_building_b]
access2-1 ansible_host=10.0.0.21
printer1  ansible_host=10.0.0.202

[sites_evpn_remote]
rcore1   ansible_host=10.1.0.1
raccess1 ansible_host=10.1.0.11

[site_group_evpn_campus:children]
sites_building_a
sites_building_b

[tags_fabric_spine]
core1
edge-wan
core2
rcore1

[device_roles_fabric_border]
core1
core2
rcore1

[device_roles_fabric_leaf]
access1-1
access2-1
raccess1
orphan1

[device_roles_distribution_switch]
dist1

# An ordinary NetBox site holding no fabric node at all -- WAN kit and a server.
# Modelled on a real inventory: it is NOT a fabric, so it must never be asked
# for an ASN or an anycast RP, and must never be reported for lacking them.
[sites_wan_edge]
wan-rtr-1 ansible_host=10.9.0.1
fileserver ansible_host=10.9.0.2

[device_roles_wan]
wan-rtr-1

[device_roles_dhcp_server]
fileserver

[device_roles_server]
ubuntu1

[device_roles_printer]
printer1

[device_roles_wan_router]
edge-wan

[all:vars]
ansible_connection=local

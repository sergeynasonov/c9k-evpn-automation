# A leaf alone in its own site: a fabric with no spine, so nothing to peer with.
# Rendering it would produce a 'router bgp' carrying no EVPN neighbours, which
# 'acm replace' applies as a teardown of every overlay session on the switch.
#
# Fabric A is healthy in the same inventory, so this also pins down that the
# failure is per device and does not take the working fabric with it.

[sites_building_a]
core1     ansible_host=10.0.0.1
access1-1 ansible_host=10.0.0.11

[site_group_evpn_campus:children]
sites_building_a

[sites_evpn_lonely]
stranded1 ansible_host=10.3.0.11

[tags_fabric_spine]
core1

[device_roles_fabric_border]
core1

[device_roles_fabric_leaf]
access1-1
stranded1

[all:vars]
ansible_connection=local

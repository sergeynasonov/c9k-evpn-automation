# The shape the project ran on before multi-fabric: every device under one site
# group. Guards the regression that matters most -- resolving the fabric must
# not change a single peer on a fabric that already works.

[sites_evpn_building_a]
core1     ansible_host=10.67.118.64
core2     ansible_host=10.67.118.65
access1-1 ansible_host=10.67.118.71

[sites_evpn_building_b]
access2-1 ansible_host=10.67.118.72
access2-2 ansible_host=10.67.118.73
dist3-1   ansible_host=10.67.118.74
dist3-2   ansible_host=10.67.118.75

[site_group_evpn_campus:children]
sites_evpn_building_a
sites_evpn_building_b

[tags_fabric_spine]
core1
core2

[device_roles_fabric_border]
core1
core2

[device_roles_fabric_leaf]
access1-1
access2-1
access2-2
dist3-1
dist3-2

[all:vars]
ansible_connection=local

# A NetBox site-group TREE: evpn_campus nested under emea. nb_inventory follows
# the parent chain, so every device lands in both groups and there is no way to
# tell which level was meant to be the fabric. Must be refused, not guessed at.

[sites_building_a]
core1     ansible_host=10.0.0.1
access1-1 ansible_host=10.0.0.11

[site_group_evpn_campus:children]
sites_building_a

[site_group_emea:children]
site_group_evpn_campus

[tags_fabric_spine]
core1

[device_roles_fabric_border]
core1

[device_roles_fabric_leaf]
access1-1

[all:vars]
ansible_connection=local

#
# Drives the REAL fabric resolver and the REAL peer-selection tasks against a
# static inventory. Driven by tests/unit/test_fabric_resolve.py, which copies
# this file into a temp directory alongside a peer_tasks.yml extracted from
# roles/acm_evpn/tasks/01_gather_data.yml -- so neither half can drift from the
# code that ships.
#
# No NetBox and no device: fabric membership is decided entirely from inventory
# groups, which is the property that makes it testable offline at all.

- name: Fabric resolution and per-fabric peer selection
  hosts: all
  gather_facts: false
  # run_once is ignored under the 'free' strategy that ansible.cfg sets, and the
  # resolver leans on it. Same override as every playbook in the repo.
  strategy: linear
  vars:
    # The harness has no running config to scrape, so the Loopback0-matches-
    # NetBox check has nothing to compare. Irrelevant to fabric scoping.
    fabric_verify_peer_addressing: false
  tasks:
    - name: Resolve fabric membership
      ansible.builtin.import_role:
        name: underlay_readiness
        tasks_from: fabric_resolve.yml

    # acm_evpn resolves in 01_gather_data.yml and then imports underlay_readiness
    # as a pre-flight, which enters the resolver again. Driven by the test with
    # -e reentry=true, so the guard inside fabric_resolve.yml is exercised by the
    # same path the role actually takes.
    - name: Resolve fabric membership again (pre-flight re-entry)
      ansible.builtin.import_role:
        name: underlay_readiness
        tasks_from: fabric_resolve.yml
      when: reentry | default(false) | bool

    # Tasks 13-15: which fabrics this run targets, and dropping the spines the
    # playbooks' unscoped ':tags_fabric_spine' union pulls in from the others.
    - name: Target scoping
      ansible.builtin.import_tasks: target_tasks.yml

    # The render gate from 02_render_configs.yml: acm_evpn renders nothing for a
    # device that is not a fabric node, but underlay_readiness must still have
    # checked it, so the drop lives there rather than in the resolver.
    - name: Render gate
      ansible.builtin.import_tasks: render_gate_tasks.yml
      when: render_gate | default(false) | bool

    - name: Peer selection
      ansible.builtin.import_tasks: peer_tasks.yml

    # Collected from hostvars rather than written per host, so that hosts which
    # ended the play still appear -- their absence from ansible_play_hosts is
    # itself one of the things under test.
    - name: Write the result for the test to read
      ansible.builtin.copy:
        content: "{{ _result | to_nice_json }}"
        dest: "{{ result_file }}"
        mode: "0644"
      vars:
        _hosts: >-
          {%- set out = {} -%}
          {%- for host in ansible_play_hosts_all | sort -%}
          {%-   set hv = hostvars[host] -%}
          {%-   set _ = out.update({host: {
                  'fabric_id': hv.fabric_id | default(''),
                  'fabric_members': hv.fabric_members | default([]),
                  'fabric_asn': hv.fabric_asn | default(''),
                  'peer_ips': hv.peer_ips | default([])}}) -%}
          {%- endfor -%}
          {{ out | to_json }}
        _result:
          targeted: "{{ ansible_play_hosts_all | sort }}"
          survivors: "{{ ansible_play_hosts | sort }}"
          orphans: "{{ fabric_orphans }}"
          targeted_fabrics: "{{ targeted_fabrics | default([]) }}"
          fabric_map: "{{ fabric_map }}"
          fabric_ids: "{{ fabric_ids }}"
          fabric_asn_map: "{{ fabric_asn_map }}"
          fabric_asn_missing: "{{ fabric_asn_missing }}"
          hosts: "{{ _hosts | from_json }}"
      run_once: true
      delegate_to: localhost

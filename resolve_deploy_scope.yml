---
# Resolve which devices a generate or deploy run acts on, and put them in the
# 'acm_deploy_scope' group. Imported by BOTH generate_evpn.yml and
# deploy_evpn.yml, never run on its own -- one play, so the run that previews a
# change and the run that applies it cannot disagree about where it lands.
#
#   one fabric  : -e deploy_target=site_group_evpn_campus
#   one building: -e deploy_target=sites_evpn_building_a
#   one leaf    : -e deploy_target=access1-1
#   every fabric: -e deploy_target=all
#
# WHY THE SPINES NEED RESOLVING RATHER THAN PATTERN-MATCHING
#
# Adding or removing a leaf changes that fabric's spines' EVPN peer list, so a
# spine left out of the play keeps a stale 'router bgp' until someone remembers
# to run it separately. A target naming a whole site or site group already
# selects its own spines -- every fabric's spines live in its own site -- but
# 'deploy_target=access1-1' does not, and that is the case this exists for.
#
# It used to be handled by unioning ':tags_fabric_spine' onto the pattern, which
# is ESTATE-WIDE: a campus deploy selected the CML lab's spines on every run and
# then dropped them in a task. That is selecting devices in order to discard
# them, and it made two healthy switches appear in every summary as though they
# had failed. It also could not be narrowed in the pattern, because ':&' applies
# to everything accumulated to its left -- 'access1-1:site_group_x:&tags_fabric_
# spine' intersects access1-1 itself away.
#
# generate_evpn.yml kept that union for a while after deploy_evpn.yml dropped
# it, so a generate contacted a different set of switches than the deploy it
# was meant to preview. Sharing this file is what stops that recurring.
#
# So the scope is resolved first, from the same inventory-group logic the roles
# use, and only the spines of the fabrics deploy_target actually names are
# added. Nothing outside those fabrics is ever contacted.
#
# ':' is still a union within the resolved scope, so 'deploy_target=<site>'
# selects that site's distribution switches too. They are dropped, and reported,
# by fabric_resolve.yml before anything touches a device.
#
# deploy_target is REQUIRED. Omitting it is refused before anything is
# contacted -- see fabric_resolve.yml task 2.
- name: Resolve the deploy scope, including this fabric's spines
  hosts: localhost
  gather_facts: false
  # add_host bypasses the host loop, which the 'free' strategy in ansible.cfg
  # refuses outright. One host in this play either way.
  strategy: linear
  tasks:
    - name: Resolve fabric identity from inventory
      ansible.builtin.import_role:
        name: underlay_readiness
        tasks_from: fabric_map.yml

    - name: Work out the scope, and which spines belong in it
      ansible.builtin.set_fact:
        acm_deploy_scope: "{{ (_resolved | from_json).scope }}"
        acm_deploy_matched: "{{ (_resolved | from_json).matched }}"
        acm_deploy_skipped: "{{ (_resolved | from_json).skipped }}"
      vars:
        _resolved: >-
          {%- set targeted = query('ansible.builtin.inventory_hostnames',
                                   deploy_target | default('all')) -%}
          {#- fabric_ids is the subset of sites/site groups that actually hold a
              fabric node, so a target naming a site of WAN kit or servers
              contributes no fabrics and therefore no spines.

              fabric_map.get, not map('extract', fabric_map): a device with no
              site has no entry at all, and 'extract' raised on it, so any
              target selecting one -- deploy_target=all, in any NetBox holding
              a single siteless device -- failed here before the run began.
              Such a device names no fabric; fabric_resolve.yml task 4 reports
              it and task 7 skips it, as for any other target. -#}
          {%- set fabrics = [] -%}
          {%- for h in targeted
                if fabric_map.get(h, '') in fabric_ids
                   and fabric_map[h] not in fabrics -%}
          {%-   set _ = fabrics.append(fabric_map[h]) -%}
          {%- endfor -%}
          {%- set out = targeted | list -%}
          {%- for s in groups.get('tags_fabric_spine', [])
                if fabric_map.get(s) in fabrics and s not in out -%}
          {%-   set _ = out.append(s) -%}
          {%- endfor -%}
          {#- Only devices in a role this automation acts on reach the next
              play. A site-scoped target also selects the servers, printers
              and WAN kit that share the site; fabric_resolve.yml task 8 would
              drop them anyway, but only after they had entered the device play
              and appeared in its recap as though they had been deployed to.
              Same list, same test as task 8, which stays as the backstop. -#}
          {%- set managed = [] -%}
          {%- for g in fabric_managed_groups -%}
          {%-   set _ = managed.extend(groups.get(g, [])) -%}
          {%- endfor -%}
          {{ {'scope': out | select('in', managed) | unique | sort,
              'skipped': out | reject('in', managed) | unique | sort,
              'matched': targeted | list | sort} | to_json }}

    # A deploy_target that matches no host leaves the next play with no hosts,
    # and Ansible treats that as a WARNING and exit 0 -- so a typo reads exactly
    # like a successful run that had nothing to do. While the spine union was
    # in the pattern a typo at least selected the spines and tripped
    # 01_gather_data.yml task 14; without it, nothing would. Refuse here.
    #
    # Judged on what the target MATCHED, not on what survived the role filter
    # above: a target naming only servers is a real target that this
    # automation has nothing to do for, not a typo, and ends quietly as before.
    - name: Refuse a deploy_target that matches nothing
      ansible.builtin.assert:
        that:
          - acm_deploy_matched | length > 0
        fail_msg: |-
          deploy_target={{ deploy_target | default('') }} matches no device in the inventory.

          Fabrics in this inventory: {{ fabric_ids | join(', ') or 'none' }}

          Give a fabric above, a sites_<slug> within one, or a hostname.
        quiet: true

    - name: Report devices the target selected that this automation does not act on
      ansible.builtin.debug:
        msg: >-
          scope: skipped {{ acm_deploy_skipped | length }} device(s) not in a
          fabric role ({{ fabric_managed_groups | join(', ') }}):
          {{ acm_deploy_skipped | join(', ') }}. A switch in the fabric
          transit path listed here needs its device role adding to
          fabric_managed_groups.
      when: acm_deploy_skipped | length > 0

    # add_host rather than templating the next play's 'hosts:' from a fact:
    # 'hosts' is validated when the playbook is PARSED, before this play has
    # run, so a fact-derived pattern is empty at that moment and --syntax-check
    # refuses the file. A group name is static and survives parsing.
    #
    # These names already exist in inventory, so this adds group membership and
    # nothing else -- ansible_host and every NetBox-derived var are untouched.
    - name: Put the resolved scope in a group the next play can name
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: acm_deploy_scope
      loop: "{{ acm_deploy_scope }}"
      changed_when: false

    - name: Report the scope this run resolved to
      ansible.builtin.debug:
        msg: >-
          deploy_target={{ deploy_target | default('(unset)') }} resolves to
          {{ acm_deploy_scope | length }} device(s) in
          {{ _fabric_names | from_json | join(', ') or 'no fabric' }}
      vars:
        # fabric_map.get for the same reason as above: a siteless fabric-role
        # device is in scope here, and is reported and skipped later.
        _fabric_names: >-
          {%- set names = [] -%}
          {%- for h in acm_deploy_scope
                if fabric_map.get(h, '') and fabric_map[h] not in names -%}
          {%-   set _ = names.append(fabric_map[h]) -%}
          {%- endfor -%}
          {{ names | sort | to_json }}

---
# Underlay readiness: assert a switch is fit for fabric provisioning, and
# configure the two things this role owns (SNMPv3 and the platform baseline).
# Run at onboarding, before deploy_evpn.yml ever touches the node. Safe to
# re-run: it only ever adds, and never removes.
#
#   deploy_target is REQUIRED -- an unscoped run is refused, naming the fabrics.
#   one fabric   : ansible-playbook readiness.yml -e deploy_target=site_group_evpn_campus
#   one building : ansible-playbook readiness.yml -e deploy_target=sites_evpn_building_a
#   one switch   : ansible-playbook readiness.yml -e deploy_target=access1-1
#   check only   : ansible-playbook readiness.yml -e readiness_apply_baseline=false \
#                                                 -e readiness_apply_snmp=false
#
# Every unready switch gets readiness-results/<hostname>-readiness.cfg, a
# paste-ready remediation file. The play prints one summary and fails once at
# the end rather than per host, so a fabric-wide first run tells you about every
# switch instead of stopping at the first.
#
# Unlike the EVPN playbooks this does not union the spines in: nothing here
# depends on fabric-wide state, so a narrow run is exactly as correct as a wide
# one. The MSDP mesh check reads its peers from the inventory rather than from
# the other spines' facts, so it still works with one spine in the play.
# Distribution switches are included deliberately. This role checks the UNDERLAY,
# and a distribution switch between a fabric leaf and a fabric border carries
# fabric traffic -- a wrong MTU or a missing PIM on it breaks the overlay exactly
# as it would on a leaf. acm_evpn renders nothing for them; that is a separate
# question, decided in that role.
- name: Verify underlay readiness
  vars:
    readiness_default_target: >-
      device_roles_fabric_border:device_roles_fabric_leaf:tags_fabric_spine:device_roles_distribution_switch
  hosts: >-
    {{ deploy_target
       | default(readiness_default_target) }}
  gather_facts: false
  # LOAD-BEARING. ansible.cfg sets 'strategy = free' globally, and run_once is
  # NOT supported under it -- Ansible warns and runs the task for every host.
  # The reporting tasks (classify, CSV, summary, the single failure) are all
  # run_once, so this override is what makes the summary appear once instead of
  # once per switch.
  strategy: linear
  # Report on every switch rather than stopping at the first unready or
  # unreachable one -- onboarding a building wants the full list, not the first
  # name in it. The single failure at the end of the role provides the exit code.
  any_errors_fatal: false
  max_fail_percentage: 100
  tasks:
    # import_role, NOT include_role. The role's reporting tasks are run_once,
    # and run_once inside a DYNAMIC include fires once per host instead of once
    # per play -- which made every host re-run the results-directory cleanup and
    # delete the remediation files the previous hosts had just written.
    - name: Execute underlay_readiness role
      ansible.builtin.import_role:
        name: underlay_readiness

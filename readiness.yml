---
# Underlay readiness: assert a switch is fit for fabric provisioning, and
# configure the things this role owns -- the platform baseline, plus SNMPv3 and
# syslog where group_vars/all/deployment.yml enrols them. Run at onboarding,
# before deploy_evpn.yml ever touches the node. Safe to re-run: it only ever
# adds, and never removes.
#
# SNMPv3 and syslog are OPTIONAL and are enrolled by what deployment.yml
# declares, not by a flag here: comment their keys out and the role does not
# read, push, check or report on them at all.
#
#   deploy_target is REQUIRED -- an unscoped run is refused, naming the fabrics.
#   one fabric   : ansible-playbook readiness.yml -e deploy_target=site_group_evpn_campus
#   one building : ansible-playbook readiness.yml -e deploy_target=sites_evpn_building_a
#   one switch   : ansible-playbook readiness.yml -e deploy_target=access1-1
#   check only   : ansible-playbook readiness.yml -e deploy_target=<fabric> \
#                    -e readiness_apply_baseline=false -e readiness_apply_snmp=false
#
# Every unready switch gets readiness-results/<hostname>-readiness.cfg, a
# paste-ready remediation file. The play prints one summary and fails once at
# the end rather than per host, so a fabric-wide first run tells you about every
# switch instead of stopping at the first.
#
# Unlike the EVPN playbooks this does not union the spines in: nothing here
# depends on fabric-wide state, so a narrow run is exactly as correct as a wide
# one. The MSDP mesh check reads its peers from the inventory rather than from
# the other spines' facts, so it still works with one spine in the play.
# Distribution switches are included deliberately. This role checks the UNDERLAY,
# and a distribution switch between a fabric leaf and a fabric border carries
# fabric traffic -- a wrong MTU or a missing PIM on it breaks the overlay exactly
# as it would on a leaf. acm_evpn renders nothing for them; that is a separate
# question, decided in that role.
#
# The scope is resolved first, on localhost, like generate and deploy do --
# but without adding spines. It keeps only devices in a role this automation
# acts on (fabric_managed_groups), so a site-scoped target no longer pulls the
# servers and printers sharing the site into the play, its recap and the CSV;
# they are named once instead. And a target matching nothing at all -- a typo,
# or an inventory that failed to load -- is refused rather than ending as a
# successful run with no hosts.
- name: Resolve the readiness scope
  hosts: localhost
  gather_facts: false
  # add_host bypasses the host loop, which the 'free' strategy refuses.
  strategy: linear
  vars:
    readiness_default_target: >-
      device_roles_fabric_border:device_roles_fabric_leaf:tags_fabric_spine:device_roles_distribution_switch
  tasks:
    - name: Resolve fabric identity from inventory
      ansible.builtin.import_role:
        name: underlay_readiness
        tasks_from: fabric_map.yml

    - name: Work out the scope
      ansible.builtin.set_fact:
        readiness_scope: "{{ (_resolved | from_json).scope }}"
        readiness_matched: "{{ (_resolved | from_json).matched }}"
        readiness_skipped: "{{ (_resolved | from_json).skipped }}"
      vars:
        _resolved: >-
          {%- set targeted = query('ansible.builtin.inventory_hostnames',
                                   deploy_target | default(readiness_default_target)) -%}
          {%- set managed = [] -%}
          {%- for g in fabric_managed_groups -%}
          {%-   set _ = managed.extend(groups.get(g, [])) -%}
          {%- endfor -%}
          {{ {'scope': targeted | select('in', managed) | unique | sort,
              'skipped': targeted | reject('in', managed) | unique | sort,
              'matched': targeted | list | sort} | to_json }}

    # Ansible only WARNS on a pattern matching nothing, and the next play then
    # ends with 'no hosts matched' and exit 0. Judged on what the target
    # matched, so a target of only servers still ends quietly, as before.
    - name: Refuse a deploy_target that matches nothing
      ansible.builtin.assert:
        that:
          - readiness_matched | length > 0
        fail_msg: |-
          deploy_target={{ deploy_target | default('') }} matches no device in the inventory.

          Fabrics in this inventory: {{ fabric_ids | join(', ') or 'none' }}

          Give a fabric above, a sites_<slug> within one, or a hostname. If
          every name looks right, check the inventory loaded at all -- an
          unset NETBOX_API leaves only localhost.
        quiet: true

    - name: Report devices the target selected that this automation does not act on
      ansible.builtin.debug:
        msg: >-
          scope: skipped {{ readiness_skipped | length }} device(s) not in a
          fabric role ({{ fabric_managed_groups | join(', ') }}):
          {{ readiness_skipped | join(', ') }}. A switch in the fabric
          transit path listed here needs its device role adding to
          fabric_managed_groups.
      when: readiness_skipped | length > 0

    # Existing inventory names, so this adds group membership and nothing
    # else -- ansible_host and every NetBox-derived var are untouched.
    - name: Put the resolved scope in a group the next play can name
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: readiness_scope
      loop: "{{ readiness_scope }}"
      changed_when: false

- name: Verify underlay readiness
  hosts: readiness_scope
  gather_facts: false
  # LOAD-BEARING. ansible.cfg sets 'strategy = free' globally, and run_once is
  # NOT supported under it -- Ansible warns and runs the task for every host.
  # The reporting tasks (classify, CSV, summary, the single failure) are all
  # run_once, so this override is what makes the summary appear once instead of
  # once per switch.
  strategy: linear
  # Report on every switch rather than stopping at the first unready or
  # unreachable one -- onboarding a building wants the full list, not the first
  # name in it. The single failure at the end of the role provides the exit code.
  any_errors_fatal: false
  max_fail_percentage: 100
  tasks:
    # import_role, NOT include_role. The role's reporting tasks are run_once,
    # and run_once inside a DYNAMIC include fires once per host instead of once
    # per play -- which made every host re-run the results-directory cleanup and
    # delete the remediation files the previous hosts had just written.
    - name: Execute underlay_readiness role
      ansible.builtin.import_role:
        name: underlay_readiness

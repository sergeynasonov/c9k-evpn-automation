[defaults]
inventory = netbox_inv.yml
# acm_evpn includes underlay_readiness as a pre-flight, so the sibling role has
# to be resolvable. Playbooks at the repo root find it anyway; a tool that
# analyses a role on its own (ansible-lint) does not, without this.
roles_path = roles
host_key_checking = False
deprecation_warnings = False
inventory_warnings = False

forks = 50
strategy = free

gathering = explicit
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400
stdout_callback = default

[callback_default]
result_format = yaml

[inventory]
enable_plugins = netbox.netbox.nb_inventory, auto, yaml, ini

[persistent_connection]
connect_timeout = 60
command_timeout = 60

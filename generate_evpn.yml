---
# Scope a run with  -e deploy_target=<pattern>  rather than --limit.
# See the note in deploy_evpn.yml for why the spines are always included.
- name: Generate EVPN Configurations (Check Mode)
  hosts: >-
    {{ deploy_target
       | default('device_roles_fabric_border:device_roles_fabric_leaf:tags_fabric_spine') }}:tags_fabric_spine
  gather_facts: false
  strategy: linear
  tasks:
    - name: Execute EVPN Role (Generate Only)
      ansible.builtin.include_role:
        name: acm_evpn
        tasks_from: generate_only.yml
